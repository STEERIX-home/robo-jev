# Task P3 A2 — **판정 칸의 새 모집단**. 규칙은 한 줄이다: `ood_dev` 분할의 **에피소드 전부를, 통째로**.
#
# 왜 바꿨는가 (P2 리뷰 1 N1·N2, P2 fix round 1). 지금까지의 판정 칸은 `ood_dev` 24편 가운데 **8편 844틱**이었고,
# 그 칸의 한 편(`ep-E1-000235`)이 844틱의 35.5 %, 읽기가 필요한 249틱의 **63.9 %**, 그 층의 `observe` 라벨
# **157개 전부**를 갖고 있었다. 즉 이 칸의 주 결과는 한 편에 끌려간다. 새 모집단은 24편 **2,530틱**이고
# (실측 `artifacts/reports/p3-population.json`), 같은 수가 11.9 % / 30.3 %로 내려가며 **24편 모두가 비-commitment
# 층에 12틱 이상을 낸다** — 표본 단위(편)가 8 → 24로 세 배다.
#
# **왜 통째로인가 — 틱을 솎는 것은 이 경로에서 GPU를 아끼지 못한다.** 로봇 스트림은 에피소드를 처음부터 재생하므로
# 비용은 **재생한 틱 수**에 붙는다. 중간 틱을 채점에서 빼도 forward는 그대로 돌고, 비용을 줄이는 유일한 방법은
# `max_ticks`로 **뒤를 자르는 것**이다. 그런데 비-commitment 층 525틱의 251틱이 각 편 끝의 `hold` 꼬리라
# (편마다 11틱) 뒤를 자르면 바로 그 층이 사라진다. 그래서 **자르지 않는다**. 실측 비용: 틱·pass당 2B 57 ms ·
# 2B LoRA 89 · 4B T0 126 · 4B LoRA 192 ms (P2 `p2-reeval-*.json`의 분할 시간 ÷ 844틱 ÷ 3 pass).
#
# 봉인(`ood_test`)은 여기에 없다. `test`도 없다(선택에 쓰지 않는다).

version: eval-p3-decision-cell-v0.1
window_ticks: 30
shuffle_seed: 1
tokens_per_batch: 8192
fused: true              # P1·P2와 같은 서빙 구성 (몸통+분기 한 forward)

columns:
  permuted: false        # 답 변경률은 P1의 표에 있다 — 끄면 GPU pass가 하나 준다
  state_shuffle: true    # **표준 대조군** (P1·P2와 같은 열 — 바꾸지 않는다)
  instruction_shuffle: true
  commitment_shuffle: true   # P3 B2 — 상태 섞기 + 이 틱의 commitment를 이 틱의 **다른 후보**로
  rule_judge: true
  mechanical_baseline: true  # P3 B3 — "commitment 있으면 그것, 없으면 observe" (GPU pass 없음)
  selective: false
  calibration: false

tiny_scorer_report: artifacts/reports/tiny-scorer.json

splits:
  - name: robot/ood_dev
    manifest: artifacts/datasets/d1-robot/d1-rollout-labels/manifest.json
    domain: robot
    split: ood_dev
    files: ["episodes/*/streams.jsonl"]
    selection: true
    note: "봉인 계열(zoneF 개념·템플릿·prefix) **24편 전부**, 통째로 = 2,530틱. **판정 칸**(q_main)이 여기 있다"
    records: [ep-E0-000110, ep-E0-000138, ep-E0-000162, ep-E0-000164,
              ep-E0-000171, ep-E0-000217, ep-E0-000246, ep-E0-000278,
              ep-E1-000142, ep-E1-000149, ep-E1-000175, ep-E1-000181,
              ep-E1-000206, ep-E1-000217, ep-E1-000219, ep-E1-000229,
              ep-E1-000233, ep-E1-000235, ep-E1-000244, ep-E1-000261,
              ep-E1-000263, ep-E1-000267, ep-E1-000268, ep-E1-000295]
    # 주 지표(P3 B1)는 **정답이 그 틱의 현재 commitment가 아닌 틱**이다. 그 층을 다시 세려면 틱별 예측이 있어야 한다
    # (편 단위 집계로는 부분 모집단을 고를 수 없다). 이 분할의 질문 칸은 열 개라 `true`로 켜면 파일이 크게 불어나므로
    # 판정 칸만 켠다. **점수를 매긴 모집단을 바꾸지 않으므로 `eval_set.sha256`은 그대로다.**
    store_predictions: [q_main]

note: >
  이 집합으로 나온 수는 `artifacts/reports/p3-reeval-*.json`에 남는다. `commitment_shuffle`·`mechanical_baseline`은
  **평가 집합의 정체(해시)에 들어가지 않는다** — `store_predictions`와 같은 이유로, 무엇을 더 재는지를 바꿀 뿐
  무엇을 점수 매기는지를 바꾸지 않기 때문이다. 그래서 이 열을 켠 run과 끄고 돌린 run의 해시가 같다.
  표의 `episode_bootstrap` 블록이 편(에피소드)을 표본 단위로 재표집한 95 % 구간이고, 대조군 칸의 `margin_ci`는
  **같은 편에서 짝지은** 차이의 구간이다 — 그것이 0을 포함하면 그 여유는 판정이 아니다. 틱 가중 평균과 편 균등
  평균(`episode_balanced_*`)이 갈리면 그 사실도 결과의 일부다.
