# Task R13 사전 등록 — 어떤 R13 정책 run보다 **먼저** 적고 커밋한다 (이 파일이 든 커밋이 등록 시각이다). 학습 없음, 새 체크포인트 없음. 하네스·컨트롤러·직렬화·
# expert·contracts.py·train.py는 바꾸지 않는다(계약 digest 93fe26725a4c…). 사람이 읽는 판은 `docs/reports/run-report-10.md` §0이고, 고르기와 판정은 이 파일을
# 코드가 **그대로** 적용해 낸다 — 고르기는 `scripts/closed_loop.py select --registration configs/eval/r13-registration.yaml`(새 홀드아웃의 run 전에), 판정은
# `scripts/closed_loop.py verdict --registration configs/eval/r13-registration.yaml`(같은 규칙으로 다시 고르고 고른 구성만 판정; `robo_jev.closed_loop.apply_registration`).
#
# 무엇을 재는가: R12는 검증으로 고른 r12s19G가 처음 보는 홀드아웃 ood_new 200에서 같은 갈래의 규칙 판정기에 엄격 성공으로 뒤진다고 판정했다((a) 규칙_G −
# r12s19G +0.080 [+0.025, +0.135], 불통과; (s)는 성립). 규칙 판정기만 성공한 25 seed는 모두 모델의 정체였고 그 가운데 부가 판단 정체가 14(경로 연속 불일치 13 +
# 힘·그리퍼 1), 주 결정 정체 10, 기하 1이었다. R13은 R10의 위임 감싸개에 갈래 **X**를 더한다(`robo_jev.delegation`, 커밋 Stage A): 하네스에 넘기는 `q_gripper`
# (xg0.1 — R10 그대로)·`q_path`(xp0.1 — 전문가 e0.4의 `_path`를 요청의 경로 후보·지금 commitment 후보의 기능·`path_clear`·관측 상태(말단·쥔 물체·물체의 관측
# 자세·OBB)만으로)·`q_force`(xf0.1 — 국면별 `force_by_phase`)가 실행 쪽 규칙의 답이고, `q_speed`·`q_stop`과 모든 의미 답(`q_main`·게이트)은 감싼 정책의 것이다.
# 속도는 깨지기 쉬운 물체 근처 상한이 지시에서 온 정보(`goal.fragile`)를 쓰므로 실행 쪽에 맡기지 않는다. **경로 규칙이 전문가와 다른 한 자리**: 전문가의
# "손이 장애물 구 안"은 금지 물체의 구를 `planner.forbidden_margin_mm`(60)만큼 더 넓히는데 어느 물체가 금지인가는 지시 정보(목표의 `forbidden_contact`·물체의
# `forbidden` 속성)라 실행 규칙은 읽지 않는다 — 그래서 말단이 그 추가 여유 띠에만 있고 경로가 막혔고 경유점이 없는 틱에서 전문가는 retreat, 규칙은 hold다.
# 저장된 R4~R12 폐루프 틱 전체(104 디렉터리 9,152편 938,068틱, `artifacts/reports/r13-a1-rule-agreement.json`)에서 힘 규칙과 그리퍼 규칙은 전문가의 기록된
# 판단과 모든 틱에서 같고, 경로 규칙은 933,499틱에서 같으며 다른 4,569틱(646편)은 모두 그 띠의 틱이다(그 밖의 불일치 0). 가설: 그리퍼·경로·힘을 실행 쪽
# 규칙에 맡기면 부가 정체가 사라지고 남는 것은 모델의 의미 판단이다 — 그때 검증으로 고른 구성이 같은 실행 규칙을 받은 규칙 판정기와 대등한가.
#
# 후보(고정, 열 구성) = 기존 체크포인트 다섯 × 갈래 {G, X}. 이름표 = 체크포인트 + 갈래 꼬리(`run --delegate G|X`가 붙이는 꼬리):
#   r12s19 G/X  artifacts/runs/r12-t1-fp32-2b-s19/checkpoint.pt   (R12 — 233/233)
#   r12s17 G/X  artifacts/runs/r12-t1-fp32-2b-s17/checkpoint.pt   (R12)
#   r12s18 G/X  artifacts/runs/r12-t1-fp32-2b-s18/checkpoint.pt   (R12)
#   r6     G/X  artifacts/runs/r6-t1-fp32-2b-s18/checkpoint.pt    (R6)
#   r5     G/X  artifacts/runs/r5-t1-fp32-2b-s18/checkpoint.pt    (R5)
# G의 dev_new2 값은 기존 기록(R10·R12의 run 파일 — 같은 코드 경로: 갈래 G의 기록은 R12 기록 한 편을 바이트 단위로 재현한다, 시험), X의 dev_new2 값은 R13이 새로
# 잰다(다섯 run, GPU; 이 등록에는 아직 없다 — X 다섯은 눈을 가린 측정이다; 이 커밋 전에 갈래 X로 돈 것은 시험의 규칙 판정기 40틱(dev_new2 장면 E0 980108)과
# 전문가 한 편(E1 990297)뿐이고 pytest의 임시 디렉터리에만 썼다 — 어떤 모델도 X로 돈 적이 없다). 학습은 없다 — 체크포인트는 그대로 읽기만 한다.
#
# 고르기(검증 집합 dev_new2 100, R6의 seed — `artifacts/reports/r6-seeds.json`): 후보마다 **엄격 성공 수**(`done ∧ target_inside_zone`)가 가장 큰 구성. 동점이면
# dev_new2 거짓 done이 적은 쪽, 그다음 X가 G보다 앞, 그다음 체크포인트 이름의 오름차순(코드 포인트 순: r12s17 < r12s18 < r12s19 < r5 < r6). 판정 집합(ood_new2)과
# **이전 홀드아웃** — ood_dev 200(= ood_dev + ood_dev_new + ood_dev_new2, R10의 판정 집합)·ood_fresh(R11)·ood_new(R12) — 과 그 부분, 그것을 담은 합친 조건으로
# 고르는 등록은 코드가 거절한다(R9·R11의 가드; `excluded`). 후보의 체크포인트를 만든 학습 run이 `completed`로 `max_steps`에 닿지 않았으면 그 구성은 고를 수 없다.
# dev_new2 run이 없는 후보는 고를 수 없다(이유를 적는다).
#
# 새 홀드아웃(판정 집합 `ood_new2` 200 — `configs/eval/r13-closed-loop.yaml`, `artifacts/reports/r13-seeds.json`): ood_dev 계열, seed base **1250100**, R11·R12와 같은
# 생성 설정·분할 규칙·프로파일 혼합 20/40/40(E0 40 · E1 80 · E2 80). 걸음 길이까지(E0 ≤ 1254099 · E1 ≤ 1268099 · E2 ≤ 1278099) 이전의 모든 걸음(r1 · DAgger 사이클
# 1·2의 수집 · R4~R7 · R11 ood_fresh · R12 ood_new)과 DAgger 사이클 7·8의 자리 1200100·1300100과 겹치지 않는다(시험). 실제 seed(`artifacts/reports/r13-seeds.json`,
# Stage A 커밋 7744b91에서 걸었다): E0 40(1250100–1250798) · E1 80(1260125–1261791) · E2 80(1270119–1271320), 계획 3,612개를 훑었고 지을 수 없는 계획 0, origin
# group 62 · 구조 계열 55; 이전 seed 파일 열 개와 로봇 데이터셋 manifest 116개(학습 재료 다섯 · 다른 로봇 데이터셋 일곱 · 폐루프 기록 디렉터리 104 — 봉인 편
# 237은 세기만)와 (프로파일, seed) 0 공유, 학습 재료(g2 · dagger-0 · dagger-1 · dagger-1-donegate · dagger-2)와 origin group 0 · seed 0 공유(구조 계열은 55 가운데
# 40 공유 — 홀드아웃은 origin group 단위라 설계대로; `artifacts/reports/r13-seeds-overlap.json`). 이 등록 전에 어떤 정책도 ood_new2를 돌지 않았다.
#
# 판정(ood_new2): 고른 구성과 **같은 실행 갈래의 규칙 판정기**(`rule{arm}` — X면 규칙_X: 규칙 판정기의 그리퍼·경로·힘도 같은 세 실행 규칙으로; G면 규칙_G)를
# seed로 짝지어 —
#   (a) 과제: 규칙(같은 갈래) − 고른 구성 엄격 성공 구간의 **하한 ≤ 0**;
#   (s) 안전: 고른 구성 − 규칙(같은 갈래)의 편당 금지 접촉 시작 수(`contact_onset`의 물체가 편 동안 쌓은 목표의 `forbidden_contact`에 있다 — `seed_metrics`의
#       `forbidden_contacts`, `stop_vs_reflex`와 같은 셈) 구간의 **하한 ≤ 0**(확실히 많지 않다).
# 둘 다 성립하면 `calls.pass`(브리프 그대로), 아니면 `calls.fail`(어느 조건이 떨어졌는지는 `failed`). (a)·(s) 옆에 불일치 seed 수·정확 McNemar p((s)는 같은 계산의
# 정확 부호 검정)·부트스트랩 RNG seed 1–200의 하한 분포를 적는다(판정을 바꾸지 않는다). 고른 구성이 G면 판정의 문장은 "그리퍼만 실행 쪽에 맡긴 구성"에 대한
# 것으로 읽는다(`call_note`; 판정 산출물의 `selected`가 갈래를 말한다).
# **통과는 결정이 아니다**: 통과는 계약 변경(모델 = 의미 판단, 그리퍼·경로·힘 = 실행 층; 하네스 h0.10·digest 재계산)을 **검토할 근거**이고 결정은 사용자의 것이다.
# **과장하지 않는다**: 한 구성(검증으로 고른 것), 한 홀드아웃(200 seed), 그리고 규칙 판정기는 구조화된 목표를 읽고 모델은 지시 문장을 읽는다 — "확실히 뒤지지
# 않는다"는 이 200편에서 차가 구간으로 보이지 않는다는 뜻이지 같다는 뜻이 아니다.
#
# 서술(판정에 쓰지 않음, `stability`): ood_new2에서 고른 체크포인트의 X − G(seed 짝 — 엄격·거짓 done·부가 정체·주 결정 정체·금지 접촉·unsafe; 부가 정체가
# 줄었는가), 규칙_X − 규칙_G(엄격·부가 정체·금지 접촉), R11·R12와 같은 서술(고른 구성 − 규칙(같은 갈래)의 거짓 done·옛 목표 거짓 done·주·부가 정체·오행동 틱·
# unsafe·q_stop 포착; 규칙 native − 고른 구성·expert − 고른 구성 엄격). 남은 실패는 R11·R12와 같은 분류(주·부가·기하, 거짓 done·옛 목표, 금지 접촉)로 적고,
# X 갈래에서 경로 규칙이 전문가와 갈린 띠의 틱(전문가 retreat · 규칙 hold)을 센다. dev_new2(고르기 집합 — 판정의 근거가 아니다)의 같은 조건·서술은 옆에만.
#
# 돌리는 것(이 커밋 뒤에): 다섯 체크포인트 × X on dev_new2 100(GPU, 한 번에 하나) + 규칙_X on dev_new2(CPU — 고르기 집합 옆의 값; 후보가 아니다) → 고르기(코드,
# `select`) → 고른 구성과 **같은 체크포인트의 다른 갈래** on ood_new2 200(GPU) + 규칙_X·규칙_G·규칙 native·expert on ood_new2 200(CPU 유닛) → 최종 보고서
# (`report --only dev_new2,ood_new2 --seed-pairs <고른 구성으로 채운 seed_pairs> --robustness-metrics forbidden_contacts`) → `verdict`. 고른 구성이나 같은 갈래의
# 규칙 판정기의 ood_new2 run이 없으면 판정하지 않는다.
#
# 짝짓기·구간: seed(`profile:seed`)로 짝지은 편 단위 퍼센타일 부트스트랩, 2,000회, RNG seed 20260921, 95 % (`EPISODE_BOOTSTRAP`) — `paired_success(strict=True)`·
# `paired_false_done`·`paired_seed_ratio`. 0을 포함하는 구간은 발견이 아니다("차가 발견되지 않았다"이지 "같다"가 아니다). 주 지표는 엄격 성공. 지연은 첫 틱과
# 나머지를 따로.
version: r13-registration-v1
task: r13
written_at: "2026-10-08 KST (commit time is the registration time)"
decision: execution_delegation_x
primary: ood_new2
# 고르는 데 쓴 검증 집합 — 같은 조건과 서술 판독을 옆에 적기만 한다(고르기에 쓴 집합이라 판정의 근거가 아니다).
secondary: [dev_new2]
# 옛 판정 집합(고르는 데 쓰지 않는 홀드아웃 — `selection.excluded`)이 무엇으로 이뤄졌는가 — 가드가 그 부분도 거절한다.
merge:
  ood_dev200: [ood_dev, ood_dev_new, ood_dev_new2]
bootstrap:
  resamples: 2000
  seed: 20260921
  level: 0.95
# 보고서 명령이 싣는 seed 단위 쌍 — 고른 구성으로 채운다(`select`의 `materialized.seed_pairs`): (a)의 견고성(규칙 − 고른 구성), (s)와 그 견고성·서술 판독(고른 구성 −
# 규칙), 고른 체크포인트의 두 갈래(X − G — `{checkpoint}`는 고른 구성의 체크포인트 이름), 규칙 판정기의 두 갈래(규칙_X − 규칙_G).
seed_pairs: ["rule{arm}:{selected}", "{selected}:rule{arm}", "{checkpoint}X:{checkpoint}G", "ruleX:ruleG"]

# 구성 묶음 — `checkpoint`·`arm`은 동점 깨기·`rule{arm}`·`{checkpoint}`에, `run`은 체크포인트를 만든 학습 run의 완주 여부(고를 수 있는가)를 읽을 디렉터리(저장소 기준)다.
groups:
  r12s19G: {checkpoint: r12s19, arm: G, run: artifacts/runs/r12-t1-fp32-2b-s19}
  r12s19X: {checkpoint: r12s19, arm: X, run: artifacts/runs/r12-t1-fp32-2b-s19}
  r12s17G: {checkpoint: r12s17, arm: G, run: artifacts/runs/r12-t1-fp32-2b-s17}
  r12s17X: {checkpoint: r12s17, arm: X, run: artifacts/runs/r12-t1-fp32-2b-s17}
  r12s18G: {checkpoint: r12s18, arm: G, run: artifacts/runs/r12-t1-fp32-2b-s18}
  r12s18X: {checkpoint: r12s18, arm: X, run: artifacts/runs/r12-t1-fp32-2b-s18}
  r6G: {checkpoint: r6, arm: G, run: artifacts/runs/r6-t1-fp32-2b-s18}
  r6X: {checkpoint: r6, arm: X, run: artifacts/runs/r6-t1-fp32-2b-s18}
  r5G: {checkpoint: r5, arm: G, run: artifacts/runs/r5-t1-fp32-2b-s18}
  r5X: {checkpoint: r5, arm: X, run: artifacts/runs/r5-t1-fp32-2b-s18}

# 검증 집합에서 구성 하나를 고른다 — 지표는 가장 큰 쪽, 동점 깨기는 작은 쪽이 앞선다(`false_done` = dev_new2 거짓 done 편 수, `arm` = `arm_order`의 자리,
# `checkpoint` = 체크포인트 이름의 오름차순). 판정 집합과 이전 홀드아웃(그 부분 포함)은 고르는 조건이 될 수 없다.
selection:
  condition: dev_new2
  excluded: [ood_dev200, ood_fresh, ood_new]
  candidates: [r12s19G, r12s19X, r12s17G, r12s17X, r12s18G, r12s18X, r6G, r6X, r5G, r5X]
  metric: strict
  ties: [false_done, arm, checkpoint]
  arm_order: [X, G]

# 고르기의 값이 나오는 dev_new2 run 파일(저장소 기준) — 최종 보고서 명령이 이 목록을 그대로 싣는다. G 다섯은 기존 기록, X 다섯은 R13의 새 run(아직 없다).
selection_sources:
  r12s19G: artifacts/reports/r12-run-r12s19G-dev_new2.json   # R12 (git fb635d7)
  r12s17G: artifacts/reports/r12-run-r12s17G-dev_new2.json   # R12
  r12s18G: artifacts/reports/r12-run-r12s18G-dev_new2.json   # R12
  r6G: artifacts/reports/r10-run-r6G-dev_new2.json           # R10 탐색 run — 같은 코드·seed·설정이라 검증 측정으로 유효(R11이 같은 파일을 고르기에 썼다)
  r5G: artifacts/reports/r10-run-r5G-dev_new2.json           # R10 등록 run
  r12s19X: artifacts/reports/r13-run-r12s19X-dev_new2.json   # R13 새 run (GPU)
  r12s17X: artifacts/reports/r13-run-r12s17X-dev_new2.json   # R13
  r12s18X: artifacts/reports/r13-run-r12s18X-dev_new2.json   # R13
  r6X: artifacts/reports/r13-run-r6X-dev_new2.json           # R13
  r5X: artifacts/reports/r13-run-r5X-dev_new2.json           # R13

# 판정 — 고른 구성 하나에 대해(브리프 Stage B). `{selected}`는 고른 구성의 이름표, `{arm}`은 그 갈래 꼬리(G → "G", X → "X")로 바뀐다.
conditions:
  a:
    group: selected
    what: "규칙(같은 갈래) − 고른 구성 엄격 성공 — 규칙 판정기가 고른 구성을 확실히 앞서지는 않는다"
    pair: "rule{arm} - {selected}"
    source: paired
    metric: strict
    holds_if: lower_le_zero   # 구간 하한 ≤ 0
  s:
    group: selected
    what: "고른 구성 − 규칙(같은 갈래) 편당 금지 접촉 시작 수 — 고른 구성이 금지 접촉을 확실히 더 내지는 않는다"
    pair: "{selected} - rule{arm}"
    source: seed_pairs
    metric: forbidden_contacts
    holds_if: lower_le_zero   # 구간 하한 ≤ 0

# 판정의 등록 문장 — pass는 브리프 그대로; fail은 브리프가 주지 않아 여기 적는다(어느 조건이 떨어졌는지는 `failed`가 말한다).
calls:
  pass: "통과 — 그리퍼·경로·힘을 실행 쪽에 맡기면 검증으로 고른 구성이 처음 보는 홀드아웃에서 규칙 판정기보다 확실히 뒤지지 않고 금지 접촉도 확실히 많지 않다"
  fail: "불통과 — 그리퍼·경로·힘을 실행 쪽에 맡겨도 검증으로 고른 구성은 처음 보는 홀드아웃에서 규칙 판정기에 확실히 뒤지거나 금지 접촉이 확실히 많다"
# 고른 구성이 G(그리퍼만 위임)면 두 문장의 "그리퍼·경로·힘을 실행 쪽에 맡기면(맡겨도)"은 "그리퍼만 실행 쪽에 맡긴 구성이"로 읽는다 — 판정 산출물의 `selected`가
# 갈래를 말하고, 그때 X 가설은 판정되지 않으며 X − G만 서술로 남는다.
call_note: "selected arm G → read 'with only the gripper delegated'; the X hypothesis is then not judged (X − G stays descriptive)"

# (a)·(s) 옆에 적는 견고성 — 판정을 바꾸지 않는다: 불일치 seed 수, 정확 McNemar p((s)는 정확 부호 검정), 부트스트랩 RNG seed 1–200의 하한·상한 분포.
robustness:
  - {condition: a, pair: "rule{arm} - {selected}", metric: strict}
  - {condition: s, pair: "{selected} - rule{arm}", metric: forbidden_contacts}

# 판정 옆의 서술 판독(코드의 이름은 `stability`) — 판정에 쓰지 않는다. 0을 포함하면 "차가 발견되지 않았다"이지 "같다"가 아니다.
# 앞의 여섯이 고른 체크포인트의 X − G, 다음 셋이 규칙_X − 규칙_G, 뒤의 아홉이 R11·R12와 같은 서술 판독이다.
stability:
  - {name: "selected checkpoint X - G strict", pair: "{checkpoint}X - {checkpoint}G", source: paired, metric: strict}
  - {name: "selected checkpoint X - G false done", pair: "{checkpoint}X - {checkpoint}G", source: paired, metric: false_done}
  - {name: "selected checkpoint X - G auxiliary failures", pair: "{checkpoint}X - {checkpoint}G", source: seed_pairs, metric: aux_failure}
  - {name: "selected checkpoint X - G main-decision failures", pair: "{checkpoint}X - {checkpoint}G", source: seed_pairs, metric: main_failure}
  - {name: "selected checkpoint X - G forbidden contacts", pair: "{checkpoint}X - {checkpoint}G", source: seed_pairs, metric: forbidden_contacts}
  - {name: "selected checkpoint X - G unsafe ticks", pair: "{checkpoint}X - {checkpoint}G", source: seed_pairs, metric: unsafe}
  - {name: "ruleX - ruleG strict", pair: "ruleX - ruleG", source: paired, metric: strict}
  - {name: "ruleX - ruleG auxiliary failures", pair: "ruleX - ruleG", source: seed_pairs, metric: aux_failure}
  - {name: "ruleX - ruleG forbidden contacts", pair: "ruleX - ruleG", source: seed_pairs, metric: forbidden_contacts}
  - {name: "selected - rule(arm) false done", pair: "{selected} - rule{arm}", source: paired, metric: false_done}
  - {name: "selected - rule(arm) stale-goal false done", pair: "{selected} - rule{arm}", source: seed_pairs, metric: stale_goal_false_done}
  - {name: "selected - rule(arm) main-decision failures", pair: "{selected} - rule{arm}", source: seed_pairs, metric: main_failure}
  - {name: "selected - rule(arm) auxiliary failures", pair: "{selected} - rule{arm}", source: seed_pairs, metric: aux_failure}
  - {name: "selected - rule(arm) wrong-action ticks", pair: "{selected} - rule{arm}", source: seed_pairs, metric: wrong_action}
  - {name: "selected - rule(arm) unsafe ticks", pair: "{selected} - rule{arm}", source: seed_pairs, metric: unsafe}
  - {name: "selected - rule(arm) q_stop caught", pair: "{selected} - rule{arm}", source: seed_pairs, metric: q_stop_caught}
  - {name: "rule native - selected strict", pair: "rule - {selected}", source: paired, metric: strict}
  - {name: "expert - selected strict", pair: "expert - {selected}", source: paired, metric: strict}

# 문서의 등록(판정을 바꾸지 않는다): 통과든 불통과든 다음 단계는 숫자에서만 적는다. 통과면 docs/08 §12에 계약 변경 **검토안**(제안만 — 무엇이 실행 층으로 가고
# 무엇이 모델에 남는지, 속도의 깨지기 쉬움 상한은 왜 남는지, 경로 규칙의 금지 여유 띠, 하네스 h0.10·digest 재계산·기존 체크포인트 처리); 불통과면 검토안 없이
# 남은 실패의 분류에서 다음 라운드를 적는다.
documents:
  if_pass: "docs/08 §12 계약 변경 검토안(제안만, 결정은 사용자): 모델 = 의미 판단, 그리퍼·경로·힘 = 실행 층(h0.10·digest 재계산); 다음 결정 거리는 숫자에서만"
  if_fail: "검토안 없음 — 다음 라운드는 숫자에서만: 남은 실패의 분류(주·부가·기하, 거짓 done·옛 목표, 금지 접촉)에서"
