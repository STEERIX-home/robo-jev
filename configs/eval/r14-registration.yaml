# R7 ood_dev_new2, R6 done 게이트, R11 ood_fresh, R12 dagger-2 수집·ood_new, R13 ood_new2)과 로봇 데이터셋 manifest 128개(학습 재료 다섯 · 다른 로봇 데이터셋
