      - ep-E1-000267@300-instruction

  # --- 비로봇 단일 요청 (판정 칸: 소형 scorer가 0.43~0.45 = 상태 섞기라 패턴이 없다) ---
  - name: non_robot/dev
    manifest: artifacts/datasets/d1/single/manifest.json
    domain: non_robot
    split: dev
    limit: 48                 # 177건 가운데 적재 순서 앞 48건
    selection: true
  - name: non_robot/ood_dev
    manifest: artifacts/datasets/d1/single/manifest.json
    domain: non_robot
    split: ood_dev
    limit: 48                 # 112건 가운데 앞 48건
    selection: true

note: >
  ood_test(봉인)는 어느 분할에도 없다. calibration 분할은 이 파일럿에서 쓰지 않는다(온도 보정은 학습·개발과 분리한
  데이터에서 하는 별도 단계 — docs/03 §4). 무학습(zero-shot) 실행은 같은 에피소드·레코드를 쓰되 스트림은 틱을 솎아
  잰다(프롬프트마다 캐시 없이 9~12K 토큰이라 전 틱은 예산 밖) — 그 stride는 보고서에 적는다.
