# Task v0d — 판단 요청 학습, 전체 미세조정 (BF16 계산 + MasterWeightAdamW의 fp32 master 사본; 2B 저장 단위 ≈ 26 GB). 모듈 robo_jev.decisions.train · 실행기 scripts/train_decisions.py (GPU 유닛 안에서만):
#   uv run python scripts/train_decisions.py train --config configs/train/decisions-v0-full.yaml --set train_input=<train.jsonl> --set run_name=<이름>
# 프롬프트는 진단 도구(v0c, scripts/diagnose_decisions.py)와 바이트 단위로 같다: chat, direct(Answer:에서 읽기), 한 글자 코드.
# 손실은 답 자리에서 그 질문의 코드 행만의 softmax에 대한 soft-label KL (정답 → 코드 분포는 robo_jev.decisions.examples).
kind: decisions-train-v0
model_id: Qwen/Qwen3.5-2B
train_input: null            # simgen-request/0 JSONL (v0b의 train-50k; 시운전은 v0a.1 표본의 학습 쪽)
out_dir: artifacts/runs/decisions-v0
run_name: null               # null = decisions-v0-full-<시각>
mode: full
format: chat
augment: true                # 학습 예마다 선택지 순서·예/아니오 순서·점수 방향을 무작위로 (정답도 같이)
questions_per_request: 2     # 요청마다 epoch당 최대 2개, 종류별로 고르게
type_weights: {choice: 1.0, noul: 1.0, score: 1.0}
dev_fraction: 0.02           # 레코드 열쇠(쌍은 함께) 해시로 2 % — 고르기·멈추기는 dev로만
dev_salt: v0d-dev
dev_every: 500               # dev 한 번 ≈ 300 레코드 × 15.5 배치 ≈ 4,650 프롬프트 — 2B LoRA(fp32 adapter)에서 ≈ 7.6분이라 드물게 (보고서)
dev_max_records: 300         # dev 손실은 균형 배치 전부(레코드당 ≈ 15 프롬프트)라 큰 학습 파일(train-50k의 2 % = 1,000)에서는 앞의 300개로 줄인다
dev_batch_tokens: null       # null = micro_batch_tokens
seed: 0
epochs: 1
max_steps: null              # null = epochs × epoch당 step 수
batch_examples: 32           # optimizer step 하나의 예 수 (길이로 묶은 micro-batch들의 gradient 누적)
micro_batch_tokens: 16384    # micro-batch 하나의 (예 수 × 가장 긴 길이) 상한
lr: 1.0e-5
weight_decay: 0.0
betas: [0.9, 0.999]
eps: 1.0e-8
warmup_ratio: 0.05
gradient_clip: 1.0
gradient_checkpointing: true
checkpoint_every: 1000          # 저장 단위가 커서(2B ≈ 26 GB, atomic 쓰기 중에는 두 배) 드물게
save_checkpoints: true
keep_best: false
early_stop_patience: null
min_free_disk_gb: 60         # 체크포인트를 쓰기 전 / 여유 문턱 (Task v0d §6)
metrics_every: 10
max_wall_hours: null
stop_after_steps: null
mix: []                      # 일반 능력 보호용 데이터 섞기 — 자리만 있다 (지금은 비어 있어야 한다)
device: cuda
dtype: bfloat16
