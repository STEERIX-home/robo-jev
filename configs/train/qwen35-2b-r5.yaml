# Task R5 C1 — seed 18 조리법 그대로 + **데이터 목록만 셋으로** (라벨 v2 부모판 + 첫 DAgger + 비로봇). `qwen35-2b-r2.yaml`을 잇는다.
#
#   uv run python scripts/adapt_readout.py --config configs/train/qwen35-2b-r5.yaml --mode t1 --steps 233 --seed 18 \
#       --set checkpoint_every=50 --set 'checkpoint_keep_steps=[40]' --run-id r5-t1-fp32-2b-s18 --no-eval \
#       --out artifacts/reports/r5-2b-t1-fp32-s18.json
#
# **무엇이 R3a seed 18과 다른가: 데이터뿐이다.** 조리법(fp32 master·5초 구간·backbone_lr 1e-5·readout_lr 3e-4·tick weights·seed 18·
# `max_steps 233`)은 R3a seed 18(`r3a-t1-fp32-2b-s18`)과 같다 — 같은 계산량이라 차이를 데이터에 귀속시킨다. 데이터:
#   1. `r1-rollout-labels-g2` — R1 v0.2 rollout 라벨판에서 `q_gripper` 라벨만 규칙 v2(전환 틱 한 값, 앞 2틱 허용)로 바꾼 파생판
#      (`versions.labels = labels-rollout-v1+gripper-v2`; 입력·다른 라벨·split 그대로). train 233편.
#   2. `r5-dagger/dagger-0` — R4의 **dev 조건** 모델 주행 기록 200편(s18 100 + 466 100; `model_output` = 모델의 raw 답, `labels` =
#      expert 참조, 같은 v2 규칙; split `train`, `provenance.material = error_family`). docs/04 §7의 혼합 축(기존 70 / 새 오류 계열 20 /
#      새 의미 계열 10)에서 **새 오류 계열**이므로 `material: error_family`다 — sampler의 `material_shares`(조리법 그대로 0.7/0.2/0.1)가
#      비어 있는 셋째 묶음 위에서 재정규화돼 로봇 단위의 **77.8 %가 expert 편, 22.2 %가 DAgger 편**으로 뽑힌다. 233 step = 로봇 단위
#      233개이므로 기대 노출은 expert ≈ 181편(233편의 **0.78 epoch** — seed 18의 1 epoch보다 적다) · DAgger ≈ 52편(200편의 0.26 epoch).
#      실현된 수는 run의 `metrics.json` `summary.sampler.units`에 있고 보고서 C1이 적는다.
#   3. `r1/single` — 비로봇 단일 요청, R2·R3a와 같다.
# ood_dev·ood_test 계열은 어느 manifest에도 학습 split로 들어 있지 않다(`splits: [train]`; DAgger 재료는 dev 조건 기록만이고 그 split은 train이다).
extends: qwen35-2b-r2.yaml
run_name: r5-2b
max_steps: 233                 # seed 18과 같은 계산량
checkpoint_every: 50
checkpoint_keep_steps: [40]
dataset_manifests:
  - path: artifacts/datasets/r1-robot/r1-rollout-labels-g2/manifest.json
    domain: robot
    files: ["episodes/*/streams.jsonl"]
  - path: artifacts/datasets/r5-dagger/dagger-0/manifest.json
    domain: robot
    material: error_family
    files: ["episodes/*/streams.jsonl"]
  - path: artifacts/datasets/r1/single/manifest.json
    domain: non_robot
