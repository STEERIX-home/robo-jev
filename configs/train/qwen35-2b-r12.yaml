    files: ["episodes/*/streams.jsonl"]
  - path: artifacts/datasets/r6-dagger/dagger-1/manifest.json
    domain: robot
    material: error_family
    files: ["episodes/*/streams.jsonl"]
  - path: artifacts/datasets/r6-dagger/dagger-1-donegate/manifest.json
    domain: robot
    material: error_family
    files: ["episodes/*/streams.jsonl"]
  - path: artifacts/datasets/r12-dagger/dagger-2/manifest.json   # DAgger 사이클 2 (R12 A3)
    domain: robot
    material: error_family
    files: ["episodes/*/streams.jsonl"]
  - path: artifacts/datasets/r1/single-by-split/manifest.json     # R7 A2의 분할별 판 (r6은 r1/single)
