# 기본 가치표 v0 — 행동 선택 정답의 비용표 (docs/12 §5·§16 열린 결정 1, Task v0a 지시서 §3.6).
#
# 이것은 물리가 아니라 **가치 판단**이다. 공개하고 버전을 붙인다. 값은 지시서의 제안값 그대로이고, 사용자가 예시를 검수한 뒤
# 조정한다(조정하면 `version`을 올린다 — 레코드의 `generator.values`가 이 문자열).
#
# 행동 choice의 정답: 선택지 a마다 기대 비용 E[c_a] = K개 사후 세계의 비용 평균,
#   비용(세계 하나) = Σ 사고 비용 × 그 사고가 났나(0/1) + 진행 손실(초) × delay_per_s,
#   확률 p_a = softmax(−(E[c_a] − min_b E[c_b]) / τ).
# argmax는 언제나 기대 비용 최소다(시험이 2,000개 전부에서 확인). "각 선택지가 최선이었던 빈도"는 쓰지 않는다(docs/12 §5 정정).
version: values-v0

costs:
  contact_person: 100        # 사람과 닿음 (손·자전거 탄 사람·사람이 미는 카트 포함 — catalog의 agents.*.contact)
  contact_vulnerable: 150    # 아이·노인과 닿음
  contact_vehicle: 120       # 차량·지게차와 닿음
  contact_object: 15         # 물체·장애물과 닿음 (공, 다른 로봇, 옆의 숨은 장애물, 멈춰야 할 장애물을 넘어섬)
  spill_hot: 25              # 쏟아짐(용기당): 뜨거운 액체
  spill_chemical: 40         #               약품·검체
  spill_other: 8             #               그 밖(물·주스·찬 음료)
  delay_per_s: 1.0           # 진행 손실 1초당
  # Task v0b — 새 현상의 사고 항목(더하기만 했다: 위 항목의 값은 그대로라 P1·P5 정답은 바뀌지 않는다 — 그래서 버전 이름도 그대로다).
  fall_light: 8              # P3 물건이 넘어지거나 떨어짐: 깨지지 않는 가벼운 것(플라스틱 병·화분·빈 토트)
  fall_fragile: 20           #                              깨지는 것(유리병·꽃병·잔·소포)
  fall_heavy: 40             #                              무거운 것(쌓은 상자·상자 더미·페인트 통·팔레트 짐) — 발·사람을 다칠 수 있다
  fall_chemical: 45          #                              약품(시약병·약품 드럼)
  unseated_minor: 15         # P4 제대로 앉지(끼워지지) 않은 채 두고 감: 나중에 바로잡을 수 있는 것(선반의 상자·접시·컵)
  unseated_major: 45         #                                          불량·시험 망침·떨어질 위험(고정구의 부품·리더의 플레이트·랙의 팔레트·커넥터)
  damage: 40                 # P4 눌러 넣다 물건·고정구를 망가뜨림
  human_call: 5              # P4 사람을 부름(그 사람의 수고 — 기다리는 시간은 지연으로 따로 센다)

tau: 2.0                     # 소프트맥스 온도 τ (비용 단위)

# 질문 지시문에 기준이 적혀 있을 때의 비용 덮어쓰기(행동 choice의 약 20 %, 지시서 §3.6). 질문 생성기가 지시문과 함께 넘긴다.
# 덮어쓴 항목만 바뀌고 나머지는 위 기본값이다.
criteria:
  avoid_spill:               # "쏟지 않는 것 가운데 가장 빠른 것"
    spill_hot: 1000
    spill_chemical: 1000
    spill_other: 1000
  avoid_contact:             # "닿지 않는 것 가운데 가장 빠른 것"
    contact_person: 1000
    contact_vulnerable: 1000
    contact_vehicle: 1000
    contact_object: 1000
  time_critical:             # "급하다 — 지연 1초가 평소의 세 배, 안전은 그대로 먼저"
    delay_per_s: 3.0
  avoid_fall:                # Task v0b P3: "실은 것이 넘어지거나 떨어지지 않는 것 가운데 가장 빠른 것"
    fall_light: 1000
    fall_fragile: 1000
    fall_heavy: 1000
    fall_chemical: 1000
  no_defect:                 # Task v0b P4: "제대로 앉지 않았거나 망가진 채로 두지 않는 것 가운데 가장 빠른 것"
    unseated_minor: 1000
    unseated_major: 1000
    damage: 1000
criterion_share: 0.2         # 행동 choice 가운데 기준을 적는 비율

# 계획기 권고(리뷰 1 I5): 그 순간 가능한 모든 행동을 이 기본 비용표로 비교한다. "맞는" 권고는 최선에서 τ 안쪽, "틀린" 권고는
# 최선보다 이만큼(= 2τ) 이상 나쁜 것.
wrong_recommendation_min_gap: 4.0

# ---------------------------------------------------------------------------------------------------------------
# 두 기제(리뷰 1 질문 1·6) — v0에서는 꺼져 있다: 아래 값이면 비용은 위 표 그대로다(기제가 없는 것과 같은 결과).
# 값은 사용자가 고른다 — 제안값은 values-v0.1.yaml.
# ---------------------------------------------------------------------------------------------------------------
# 충돌 속도에 따른 닿음 비용: 닿음·넘어섬 비용 × max(floor, min(1, (v / v_ref)²)), v = 처음 닿는 순간의 상대 속도(넘어섬은 장애물에 닿는 속도).
# 몸마다 v_ref. floor = 1이면 언제나 비율 1(꺼짐).
contact_speed:
  enabled: false
  v_ref: {mobile_base: 1.0, humanoid: 1.0, forklift_amr: 1.0, arm: 0.5}
  floor: 1.0
# 급제동(hard) 자체의 비용(승객·짐·넘어짐·마모) — 몸마다, 짐 실은 지게차는 따로. 0이면 꺼짐.
hard_brake_cost: {mobile_base: 0.0, humanoid: 0.0, forklift_amr: 0.0, forklift_amr_loaded: 0.0, arm: 0.0}
