# 상황 옷 카드 v0.2의 한국어 문구 (Task v0b) — 영어 문구(skins-v0.2.yaml) → 한국어. 읽는 곳: robo_jev.simgen.korean.KoSkins.
#
# text — 그대로 바꾸는 문구. 끼워 넣는 꼴을 지킨다: 상황·방해·오래된 카메라의 까닭은 '…다.'로 끝나는 합니다체 문장, 몸 이름·장소·
#        장애물·가림·막힘·경사로(끝)·돌아가는 길·쌓을 곳·모퉁이·센서 단서 물체·받침 표면·놓는 물건·자리는 조사 없는 명사구, carry는
#        '…에'로 끝나는 자리 말, 과제는 '중입니다' 앞에 오는 '…는' 마디({container:을} = 용기 문구 + 을/를).
# descriptors — 상대 묘사(np: 처음 소개하는 명사구, ref: 다시 가리키는 짧은 말). 의도·움직임을 암시하는 말을 더하지 않는다.
# objects — 용기·키 큰 물건·쌓을 물건(np: 명사구, ref: 다시 가리키는 짧은 말).
# cues — 단서 문장 틀. {ref:조사}의 조사는 받침이 있을 때의 꼴(이·은·을·과·아·으로)로 적고, 알맞은 꼴은 korean.kfmt가 고른다.
# 숫자·코드(14번 랙, B12 게이트, LH 718)와 단위(°C, ml, %)는 그대로 둔다. 영어 문구를 바꾸면 이 파일도 함께 고친다.
version: skins-ko-v0.2

