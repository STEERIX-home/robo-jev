# 상황 옷 카드 v0 — 분야 10개의 의미 층 (docs/12 §2 ①·§8, Task v0a 지시서 §3.10).
#
# 이 카드가 "LLM이 입히는 의미"다: 누가·어디서·무슨 일을 하나, 어떤 사람·차량·물체가 나오나, 무엇을 들고 있나, 상관없는 사실은
# 무엇인가. 물리 값은 여기 없다 — 단어는 catalog-v0의 종류(agent kind, container kind)를 통해서만 판단에 영향을 준다(docs/12 §4).
# 그래서 묘사(descriptor)에는 의도나 움직임을 암시하는 말을 쓰지 않는다("뛰어가는", "통화 중인" 같은 말은 단서 표가 맡는다).
# 카트를 미는 사람의 ref는 사람이다(단서 "…에 정신이 팔려 있다"는 사람의 것; 카트에 닿으면 사람 닿음으로 센다).
#
# 자리 표시: {container} = 용기 문구, {Ref}/{ref} = 상대를 가리키는 말(대문자로 시작/소문자). 문구를 바꾸면 `version`을 올린다.
version: skins-v0

# 몸의 일반 이름(분야 카드에 없을 때)
body_names:
  mobile_base: ["a wheeled service robot", "a small autonomous mobile robot"]
  humanoid: ["a humanoid robot", "a bipedal humanoid robot"]
  forklift_amr: ["an autonomous forklift", "a driverless pallet mover"]
  arm: ["a fixed robot arm", "a collaborative robot arm"]

# 단서 문구 — catalog-v0의 cues 표와 같은 키. 단서 하나가 관측이고, 문구는 그 단서만 말한다(의도를 말하지 않는다).
cue_phrases:
  person:
    slowing: ["{Ref} has been slowing down over the last half second.", "{Ref}'s steps have become shorter.", "{Ref} has lost some pace in the last moment."]
    steady: ["{Ref} is moving at a steady pace.", "{Ref} has not changed pace.", "{Ref} is still mid-stride."]
    glance: ["{Ref} glanced toward you.", "{Ref} looked up at you.", "{Ref} turned their head toward you."]
    distracted: ["{Ref} is looking down at a phone.", "{Ref}'s attention seems to be on something off to the side.", "{Ref} is talking to someone and not looking your way."]
    rushing: ["{Ref} is taking quick, hurried steps.", "{Ref} is moving briskly, almost jogging.", "{Ref} seems to be in a hurry."]
    drift_left: ["{Ref} is drifting toward your left.", "{Ref} has started edging over to your left."]
    drift_right: ["{Ref} is drifting toward your right.", "{Ref} has started edging over to your right."]
    straight: ["{Ref} is holding a straight line down the middle.", "{Ref} is coming straight down the centre."]
  vehicle:
    brake_lights: ["{Ref}'s brake lights are on.", "{Ref}'s brake lights just lit up."]
    steady: ["{Ref} is holding a steady speed.", "{Ref} has not slowed."]
    reverse_alarm: ["{Ref}'s reversing alarm is beeping.", "{Ref} has its reverse beeper going."]
    horn: ["{Ref} sounded its horn.", "{Ref} gave a short honk."]
    drift_left: ["{Ref} is easing toward your left.", "{Ref} has started steering over to your left."]
    drift_right: ["{Ref} is easing toward your right.", "{Ref} has started steering over to your right."]
    straight: ["{Ref} is holding the middle of the aisle.", "{Ref} is coming straight down the centre."]
  robot:
    amber: ["{Ref}'s status light has turned amber, its yield signal.", "{Ref} is showing an amber yield light."]
    green: ["{Ref}'s status light is green (proceeding).", "{Ref} is showing a steady green light."]
    reverse_light: ["{Ref}'s white reversing light is on.", "{Ref} is showing its reversing light."]
    priority_light: ["{Ref} is flashing its blue priority-transit light.", "{Ref} has its priority light flashing."]
    drift_left: ["{Ref} is edging toward your left.", "{Ref} has started shifting over to your left."]
    drift_right: ["{Ref} is edging toward your right.", "{Ref} has started shifting over to your right."]
    straight: ["{Ref} is holding the centre line.", "{Ref} is coming straight down the middle."]
  hand:
    holding_part: ["{Ref} is holding something close to the work surface.", "{Ref} is gripping an item near the fixture."]
    reaching_across: ["{Ref} is extended toward the far side of the cell.", "{Ref} is stretched out across the work area."]
    pulling_back: ["The elbow behind {ref} is bending back toward the person.", "{Ref}'s wrist is turning back toward the person."]
    still: ["{Ref} is not moving at the moment.", "{Ref} has been motionless for a moment."]
    reaching: ["{Ref} is reaching steadily across the bench.", "{Ref} is sweeping across at an even pace."]
    hesitating: ["{Ref} paused for a moment mid-reach.", "{Ref} hesitated briefly."]
    quick_motion: ["{Ref} is moving quickly.", "{Ref} darted forward."]

