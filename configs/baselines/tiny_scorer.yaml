# Task 2c — 소형 scorer 기준군 (docs/06 Task 2c, docs/03 §6). CPU에서 처음부터 학습한다.
#   uv run python -m robo_jev.baselines.tiny_scorer --config configs/baselines/tiny_scorer.yaml --out artifacts/reports/tiny-scorer.json --checkpoint artifacts/runs/tiny-scorer-d1/scorer.pt
#   (학습 없이 저장 모델의 표만: --eval-checkpoint artifacts/runs/tiny-scorer-d1/scorer.pt --training-report artifacts/reports/tiny-scorer.json; D1 재평가 ≈ 10분 CPU)
# 이 표가 backbone 실험의 해석 기준이다 — 인수 기준은 성능이 아니라 표가 있다는 것. 이 값이 높은 분할·질문은 의미 판단이
# 아니라 패턴으로 풀린다는 표지이고, 그 분할은 backbone의 성과 주장에 쓰지 않는다.
version: tiny-scorer-v0.1
seed: 17
threads: 8                                    # torch CPU 스레드 — 작은 행렬이라 8이 최적(D1 실측 16상태 step: 8 thread 1.14 s, 16 thread 3.35 s; rollout 작업과 같이 돌리지 않는다)

data:
  manifests:                                  # 문맥/후보 byte 텍스트로 읽는 데이터 (sampler의 manifest 꼴; 라벨은 레코드의 것)
    - path: artifacts/datasets/d1-robot/d1-rollout-labels/manifest.json   # 로봇 D1 후속 버전(rollout 라벨) — 스트림 + 틱 대조 쌍
      domain: robot
    - path: artifacts/datasets/d1/single/manifest.json                    # 비로봇 D1 (pilot 2,000건)
      domain: non_robot
  train_splits: [train]
  eval_splits: [dev, test, ood_dev]           # ood_test는 봉인 — 여기서도 보지 않는다
  robot_tick_stride: 3                        # 학습에 쓰는 로봇 틱은 3틱에 하나 (틱은 상관된 표본; 평가는 stride 2). D1 train 예제 10,303(스트림 7,818 + 단일 2,485)
  eval_robot_tick_stride: 2                   # 평가에 쓰는 로봇 틱은 2틱에 하나 (dev·test·ood_dev 85편 ≈ 7.7K틱 × 3 pass; 규칙 기준군도 같은 틱)
  max_context_bytes: 1024                     # 문맥 byte 상한 (앞을 남긴다: goal·robot·exec·commitment·이력 → 물체 → 영역·장면)
  max_candidate_bytes: 64                     # 후보 줄·질문 머리 byte 상한

model:                                        # byte 임베딩 → 문맥 Transformer → 후보가 문맥에 attention → 공유 dot product → 후보 위 softmax
  d_model: 128
  heads: 4
  ff: 256
  context_layers: 3
  candidate_layers: 1
  dropout: 0.1

train:
  epochs: 3
  batch_states: 16                            # 상태(틱·단일 요청) 수 — 문맥은 상태마다 한 번 인코딩하고 그 질문·후보가 모두 붙는다
  lr: 0.001
  weight_decay: 0.01
  warmup_ratio: 0.05
  gradient_clip: 1.0
  max_wall_minutes: 90                        # 예산을 넘으면 그 epoch에서 멈춘다 (표에 적는다). D1 실측(8 thread): 혼합 배치 3.95~4.1 s/step × 644 step/epoch ≈ 43분/epoch → 90분 상한은
                                              # ≈2.1 epoch(≈1,350 step)에서 멈춘다. step의 ≈3 s는 단일 스레드 Python(collate의 byte 인코딩·질문별 손실 루프; CPU ≈120 %)이고 8 thread 행렬은 ≈1 s —
                                              # 이월: 예제를 한 번 byte 텐서로 미리 인코딩(epoch마다 재사용)하면 step이 ≈1 s가 된다 (로봇 틱만의 warm 벤치마크 1.14 s).
  log_every: 50

eval:
  shuffle_seed: 1                             # 후보 순서 치환 (답 변경률)
  context_shuffle: true                       # 문맥 섞기 대조군 = 상태 섞기 (비로봇: 상태 전체, 로봇 스트림: goal·물체·영역·장면을 다음 에피소드의 것으로, id는 이 틱의 것으로 재매핑 — evaluate.py)
  instruction_shuffle: true                   # 로봇 스트림의 둘째 열: 지시·목표 텍스트만 굴림 (구조화 goal·상태·후보 유지; 표지를 정하지 않는다 — D1 리뷰 1 I1)
  rule_judge: true                            # 로봇 스트림의 규칙 기준군 열
  ece_bins: 10
  pattern_solvable:                           # 표지 이유: scorer_high / shuffle_high (≥ accuracy), state_shuffle_irrelevant (scorer ≥ min_accuracy_for_gap이고 scorer − 상태 섞기 ≤ shuffle_gap),
    accuracy: 0.85                            #   scorer_beats_rule_judge (규칙 기준군 열이 있고 scorer ≥ min_accuracy_for_gap이고 scorer − 규칙 ≥ rule_judge_margin — 0.9M byte 모델이 구조화 목표를 읽는 규칙보다 나으면 표면 규칙으로 닿는 수준)
    shuffle_gap: 0.05
    min_accuracy_for_gap: 0.7
    rule_judge_margin: 0.0
