# Task R1 D1 — 소형 scorer 기준군을 **R1 데이터로 다시** (docs/06 Task 2c). 입력이 바뀌었으므로(서식 v0.4: 모델이 보는
# 텍스트에 풀어 놓은 목표가 없다) D1의 패턴 표시는 무효다.
#
#   uv run python -m robo_jev.baselines.tiny_scorer --config configs/baselines/tiny_scorer_r1.yaml \
#       --out artifacts/reports/r1-tiny-scorer.json --checkpoint artifacts/runs/tiny-scorer-r1/scorer.pt
#
# 조리법(모델 크기·epoch·lr·stride·표지 기준)은 D1과 **같다** — 바뀐 것은 데이터와 그 데이터가 모델에게 보이는
# 텍스트뿐이라야 두 표를 나란히 놓을 수 있다. 기대: 로봇 dev/test `q_main`의 표지가 벗겨지거나 최소한 규칙
# 판정기를 못 이긴다 — 아니면 Stage A가 덜 닫힌 것이다.
version: tiny-scorer-r1-v0.1
seed: 17
threads: 8

data:
  manifests:
    - path: artifacts/datasets/r1-robot/r1/manifest.json
      domain: robot
    - path: artifacts/datasets/r1/single/manifest.json
      domain: non_robot
  train_splits: [train]
  eval_splits: [dev, test, ood_dev]
  robot_tick_stride: 3
  eval_robot_tick_stride: 2
  max_context_bytes: 1024
  max_candidate_bytes: 64

model:
  d_model: 128
  heads: 4
  ff: 256
  context_layers: 3
  candidate_layers: 1
  dropout: 0.1

train:
  epochs: 3
  batch_states: 16
  lr: 0.001
  weight_decay: 0.01
  warmup_ratio: 0.05
  gradient_clip: 1.0
  max_wall_minutes: 90
  log_every: 50

eval:
  shuffle_seed: 1
  context_shuffle: true
  instruction_shuffle: true
  rule_judge: true
  ece_bins: 10
  pattern_solvable:
    accuracy: 0.85
    shuffle_gap: 0.05
    min_accuracy_for_gap: 0.7
    rule_judge_margin: 0.0
