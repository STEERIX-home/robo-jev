# bench-v0 — 우리 판단 모델과 OpenRouter 결정 모델의 비교 벤치마크 정의 (Task bench0, 2026-10-12). 고정·판 붙임: 무엇이든 바꾸면 bench-v1.
#
# 같은 요청을 보내고 같은 지표로 잰다. 레코드는 원본(봉인 시험 세트 T1~T7·일반 읽기 G1·G2)에서 아래 규칙으로 다시 뽑아
# artifacts/bench/v0/<세트>.jsonl(커밋 안 함)에 원본 바이트 그대로 쓴다:
#   uv run python scripts/bench.py build          # 다시 뽑아 expect와 대조 (다르면 거절)
# 표본 규칙은 src/robo_jev/bench/define.py의 모듈 설명이다 — 층 = 대표 레코드의 meta.group × meta.language, 층마다 몫은 크기에 비례
# (최대 나머지법), 층 안은 진단 도구의 쌍 보존 표본기(select_records, --limit와 같은 알고리즘), 층 seed = sha256("bench-v0|seed|세트|층").
# T5는 쌍 단위(150쌍 = 300 레코드), T6는 기준 + 모든 변형의 묶음 단위(30묶음), G1·G2는 전부.
# expect는 처음 뽑은 결과(2026-10-12)의 기대값이다: 원본 sha256, 레코드 수, 질문 수, id 목록(파일 순서, 줄마다 id 하나)의 sha256.
version: bench-v0
seed: 20261012
strata: [group, language]
sets:
  T1:
    what: in-distribution (training styles, settings and wordings)
    source: artifacts/simgen/v0b/tests/T1.jsonl
    unit: record
    count: 300
    expect: {source_sha256: 5a0e1f3af02468ae5ace4d308997087f4570336ec6a2a0cb776da479e5590a6c, records: 300, questions: 1670,
             ids_sha256: bfb8a886e3bd3c6385eb47af0b0fc743b6c80f94d61c45a1f98b172aa2971f1e}
  T2:
    what: new style / settings / held-out wordings
    source: artifacts/simgen/v0b/tests/T2.jsonl
    unit: record
    count: 500
    expect: {source_sha256: 454378466234c2075389552c2627a42c514828dbbcc0cbb76310b08595092d1a, records: 500, questions: 2753,
             ids_sha256: 998debf0cfd8a0cdbaddba5ef5584ee408c63ddff9adf0a748fe9a4a8bf71837}
  T3:
    what: range cells outside the training ranges
    source: artifacts/simgen/v0b/tests/T3.jsonl
    unit: record
    count: 300
    expect: {source_sha256: a4bb69ab122ebba1d385dd7e4237c0fe4eaba4ec49aeaff14debcb56c445ec73, records: 300, questions: 1643,
             ids_sha256: 6b7b475042862455f8a8529775c57c915ea583674ac0a6ba26bfa99809f9a1ea}
  T4:
    what: unseen phenomenon combination P1+P3
    source: artifacts/simgen/v0b/tests/T4.jsonl
    unit: record
    count: 300
    expect: {source_sha256: 64820ce2d2bdf13522ad212bf66211bec15f62501240f843e9ac6237a45bca23, records: 300, questions: 1612,
             ids_sha256: 4401b25a0f22730efe9650026b871fb0f7357068ba5a6cc6248490120e970e0f}
  T5:
    what: one-fact pairs (numeric and wording)
    source: artifacts/simgen/v0b/tests/T5.jsonl
    unit: pair
    count: 150
    expect: {source_sha256: 11c8c759902348e6004c8dd7bd89784c580e997f9179ce2a9ab3172b94b2685d, records: 300, questions: 1670,
             ids_sha256: 045abff1c431967a07e14173f5e6cc35b631bf0af615d345e97ba8fd31961a67}
  T6:
    what: perturbation families (base + every variant)
    source: artifacts/simgen/v0b/tests/T6.jsonl
    unit: t6_family
    count: 30
    expect: {source_sha256: e117ad2c85dff948cb50f1dbcc036a47f47a835aacd79ace7ba2c30ce2dba8de, records: 390, questions: 2110,
             ids_sha256: 50e3c21fc8ec50816d014be1f4166d378dca1ac7fd29a7f8f0c30fe52f3a47f9}
  T7:
    what: calibration set (ECE)
    source: artifacts/simgen/v0b/tests/T7.jsonl
    unit: record
    count: 300
    expect: {source_sha256: 37536cd2930a0e8c8b26cb3013cd2ab5e49a4856d7d7f2ff250f8031847da1dd, records: 300, questions: 1670,
             ids_sha256: 0fdef91df31bdc757a5bbaa4eb1ef93c6547c6d76c2f0aa55b3dfec949f92088}
  G1:
    what: general reading — old non-robot test + ood_test (all)
    source: artifacts/simgen/probes/G1.jsonl
