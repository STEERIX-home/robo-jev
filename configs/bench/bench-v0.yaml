    expect: {source_sha256: 8c1e5a6c2d2d05cba4ef591d166de787737a34fb0d0cbea18342c07600bfc3b4, records: 314, questions: 2082,
             ids_sha256: 24a2bf01023fb2d93445da79a76af11f10e5163a1a5283d4ec2c7bda3560ae04}
  G2:
    what: general reading — public BoolQ dev + MultiNLI dev_matched, 500 each (all)
    source: artifacts/simgen/probes/G2.jsonl
    unit: all
    expect: {source_sha256: e97c97dd249dab9f00206a9f6aa9b470fcb9e5221a1958565783037af780d32b, records: 1000, questions: 1000,
             ids_sha256: e181b277cc91850e756925b04e768a1462fd941f4569c3ce93fb23f3131f2c90}

# score 형식 시운전: 벤치에 들지 않은 T1 레코드 100개 — 단계 둘(원래 기준점 그대로) 대 11단계. 유료 호출이라 승인 뒤에 통제자가 돌린다.
pilot:
  from: T1
  count: 100
  expect: {records: 100, questions: 562, ids_sha256: d5be2722341101c0b29571d1be179b3bbb90ba94df0beb2599a85e8152835460}

# 요청 변환 (src/robo_jev/bench/openrouter.py): choice는 criteria 맵 그대로, noul은 instructions 그대로(criteria 없음),
# score는 **원래 기준점 둘 그대로**(단계 2: 0 = …, 1 = …) — 값 = 기대 단계(= 단계 1의 확률). 상태 글은 문자열 그대로.
# 시운전(2026-10-12, T1 밖 100 레코드, 여섯 모델, 데이터 수집 거부, $0.0199)으로 정했다: API는 "A Score accepts at most 10 levels"(HTTP 422)라
# 11단계는 다섯 모델이 거절했고(Tev1 4B만 받음), 받은 Tev1에서 11단계 − 2단계 score Brier = +0.001 [−0.031, +0.032](차이 발견되지 않음).
# 2단계는 우리 요청 형식 그대로 — Decisions API가 쓰라고 만든 꼴이다.
request:
  score_levels: 2
  endpoint: https://openrouter.ai/api/alpha/decisions

# OpenRouter 결정 모델 — 기본 선택 여섯 (사용자 결정 2026-10-12: 목록의 19개를 다 돌리지 않는다). 실행 인자 --models로 바꿀 수 있다.
# :free 복제본은 언제나 뺀다(같은 모델, 엄격한 rate limit).
models:
  default:
    - id: "~typesafe/jev-latest"
      why: category reference — the robo-jev.dev benchmark site uses it (alias; the resolved version is logged per request)
    - id: microsoft/microsoft-decision-1
      why: Qwen3.5-9B post-trained for decisions — the same backbone family as ours
    - id: togethercomputer/tev1-4b-experimental
      why: 4B, close to our 2B size; also on the robo-jev.dev site
    - id: openai/gpt-6-luna-decisions
      why: frontier-lab reference
    - id: liquid/d1
      why: edge-oriented (LiquidAI) — relevant to a fast on-robot L2
    - id: upstage/solar-decide
      why: requested by the user (Solar Decide)
  exclude_suffixes: [":free"]

# 우리 모델 — 이미 있는 예측(같은 레코드, 진단 도구 v0d-diagnose-4, 프롬프트 v0c-p3, 균형 배치)에서 벤치 부분집합만 고른다. 추가 GPU 계산 없음.
# 칸마다 후보 경로를 앞에서부터 보고 처음 있는 것을 쓴다 ({set} = 세트 이름). 없으면 건너뛴다(v0.1은 오면 다시 돌린다).
# G1·G2의 기준·v0은 v0.1 pod의 같은 하드웨어 기준(H100)이 있으면 그것을, 없으면 Spark(GB10)의 것을 쓴다.
ours:
  - tag: qwen3.5-2b
    label: Qwen3.5-2B (untrained)
    role: baseline
    T: ["artifacts/cloud/runs/v0-base-01-fetched/reports/base-2b-{set}.predictions.jsonl"]
    G: ["artifacts/cloud/runs/v01-main-01-fetched/reports/base-2b-{set}.predictions.jsonl", "artifacts/reports/v01b/{set}-base-2b.predictions.jsonl"]
  - tag: robojev-v0
    label: ours v0 (2B)
    role: ours
    T: ["artifacts/cloud/runs/v0-main-01-fetched/reports/after-2b-{set}.predictions.jsonl"]
    G: ["artifacts/cloud/runs/v01-main-01-fetched/reports/v0-2b-{set}.predictions.jsonl", "artifacts/reports/v01b/{set}-v0-2b.predictions.jsonl"]
  - tag: robojev-v0.1-main
    label: ours v0.1-main (2B)
    role: ours
    T: ["artifacts/cloud/runs/v01-main-01-fetched/reports/after-v01-2b-{set}.predictions.jsonl"]
    G: ["artifacts/cloud/runs/v01-main-01-fetched/reports/after-v01-2b-{set}.predictions.jsonl"]
  - tag: robojev-v0.1-mix
    label: ours v0.1-mix (2B)
    role: ours
    T: ["artifacts/cloud/runs/v01-mix-01-fetched/reports/after-v01mix-2b-{set}.predictions.jsonl"]
    G: ["artifacts/cloud/runs/v01-mix-01-fetched/reports/after-v01mix-2b-{set}.predictions.jsonl"]
  # The v0.7 release (Task rel07, 2026-10-16): training seed 0, scored on its H100 pod with the same tool, prompt and balanced orders.
  - tag: robojev-v0.7
    label: ours v0.7 (2B)
    role: ours
    T: ["artifacts/cloud/runs/v07-s0-01-fetched/reports/after-v07-s0-2b-{set}.predictions.jsonl"]
    G: ["artifacts/cloud/runs/v07-s0-01-fetched/reports/after-v07-s0-2b-{set}.predictions.jsonl"]
