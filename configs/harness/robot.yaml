# 로봇 스트림 하네스 v0 — docs/08 §3~§5, docs/02 §3~§4.
#
# 하네스의 수치는 전부 여기에만 둔다. `harness/robot.py`·`perception/pointworld.py`에는
# 상수를 쓰지 않는다. 값은 실험 시작값이며 버전(`version`)과 함께 레코드에 기록한다
# (docs/08 §8 `versions.harness`).
#
# 실행기와 공유하는 수치(수명·속도 수준·힘 수준·그리퍼 폭·도달 범위)는 여기 **복사하지
# 않는다**. 컨트롤러 설정이 그 단일 출처이고 하네스가 그것을 읽는다 — 두 곳에 적으면
# 언젠가 어긋나고, 그때 하네스는 컨트롤러가 거절할 명령을 만든다.
version: h0.7
controller_config: configs/controller/osc_v0.yaml

# 질문 세트 v0 (docs/08 §4). 세트는 하네스 버전으로 고정하고 후보만 틱마다 바뀐다.
# `language`는 질문 문구를 고른다(후보 줄은 계약 v0.3부터 의미 키 기반이라 언어가 없다). ko 문구는 계약의
# `contracts.QUESTION_SET_V0`와 같아야 한다(검사가 대조한다).
language: ko
question_set_id:
  ko: qs-v0
  en: qs-v0-en
questions:
  q_main:
    ko: "지금 실행할 행동을 고르라."
    en: "Choose the action to execute now."
  q_done:
    ko: "현재 목표를 이미 만족했는가."
    en: "Is the current goal already satisfied?"
  q_instr:
    ko: "실행에 필요한 지시가 충분한가."
    en: "Is the instruction sufficient to execute?"
  q_observe:
    ko: "관측을 더 얻어야 하는가."
    en: "Should more observation be gathered?"
  q_retry:
    ko: "직전 실패와 같은 방식의 재시도가 적절한가."
    en: "Is retrying the same way as the last failure appropriate?"
  q_stop:
    ko: "지금 즉시 멈춰야 하는가."
    en: "Must the robot stop right now?"
  q_gripper:
    ko: "commitment의 행동·국면 기준으로 원하는 그리퍼 상태를 고르라."
    en: "Choose the desired gripper state for the committed action and phase."
  q_path:
    ko: "commitment의 행동·국면 기준으로 경로를 고르라."
    en: "Choose the path for the committed action and phase."
  q_speed:
    ko: "commitment의 행동·국면 기준으로 속도 수준을 고르라."
    en: "Choose the speed level for the committed action and phase."
  q_force:
    ko: "commitment의 행동·국면 기준으로 접촉·힘 수준을 고르라."
    en: "Choose the contact/force level for the committed action and phase."

# 앞단(3D 재구성) 요약. D1의 참값 어댑터가 채우는 값이며, E2에서 시뮬 3D 카메라로
# 바뀌어도 **스키마와 이 키들**은 그대로다 (docs/08 §3.2 "앞단 조건").
perception:
  geom_period_ms: 200        # 3D 재구성 갱신 주기 (기하 5Hz 시작값)
  visible_ratio_threshold: 0.6
  precision_mm:              # 자세 정밀도 추정 (mm 오차 범위). 참값을 쓰지 않는 공칭값이다
    visible: 3
    occluded: 12
  surface_conf:
    visible: 0.92
    occluded: 0.55
  points_visible: 480        # 점군 점 수 요약
  points_occluded: 60
  # 물체 이동 사건은 **관측된 변위**(두 기하 갱신 사이의 자세 차이)에서만 만든다
  # (docs/08 §3.2 `events[]`). 문턱은 자세 정밀도 이상이어야 한다 — 정밀도 안의 흔들림은 이동이 아니다.
  moved_threshold_mm: 8
  moving_window_ms: 1000     # 관측된 이동 뒤 이 시간 동안은 '이동 대상'으로 본다
  # 시뮬레이터만 아는 사건. 상태에 넣지 않고 레코드의 evidence로만 보낸다 (docs/08 §3.2 `events[]`).
  evidence_only_events: [disturbance_applied]
  graspable_faces:           # 형상별 파지 가능 면 (앞단이 표면에서 뽑는 값의 자리)
    box: [top, side]
    cylinder: [top, side]
  max_graspable_width_mm: 78 # 그리퍼 개방 폭보다 넓은 면은 파지면이 아니다

# 결합 행동 후보 (docs/08 §4 `q_main`, docs/02 §3). 계약 v0.3(08 §4·§5-3): 결합 키는
# `기능:대상:접근:목적지`이고 프로파일은 키에 없다 — 속도는 `q_speed`가 commitment 기준으로 답하고 전환 틱의
# 초기값은 `compose.initial_profile`이다. K ≤ 12 = 9 + 예약 3.
candidates:
  max: 12                    # K≤12 (docs/08 §4 표준 묶음)
  reserved: 3                # observe·hold·replan은 상한 안에서 자리를 예약한다
  # 실행기가 쓸 수 있는 접근 유형(실행기 역량). v0 실행기는 손목 회전이 없어(손가락은 로봇 기준
  # y축으로 열린다) 옆에서 미끄러져 들어가는 `side` 파지가 물리적으로 성립하지 않는다 — 위에서
  # 내려오는 `top`만 연다. 앞단의 파지 가능 면(`perception.graspable_faces`)은 그대로 상태에 실리고,
  # 여기 없는 면의 조합은 후보 회계의 `dropped.unsupported_face`로 센다(물체의 실행 가능성이 아니라
  # 실행기 역량이다). 실행기가 손목 요(yaw)를 얻으면 여기에 `side`를 더한다 — 코드 변경 없이 돌아온다.
  faces: [top]
  # 밀기 방향은 **열거가 아니라 허용 축 집합**이다(계약 v0.3). 물체마다 관측된 자세와 영역 경계에서 각 영역 쪽으로
  # 미는 축 방향(영역 중심까지의 거리를 가장 줄이는 축, 물체당 ≤ 영역 수)만 만들고, 이 집합 밖의 축은 만들지
  # 않는다. 이 집합은 `faces`와 달리 실행기 역량이 **아니라 장면의 기하**다: v0 실행기가 아직 쓰지 못하는 ±y(원통에서
  # 반사 정지가 잦다 — configs/sim/expert_v0.yaml `goal.push_directions`)도 영역 쪽이면 후보로 제시한다. 의미 적합성은
  # 목표에서 오고 실행 가능성은 실행기 역량에서 온다(docs/08 §4·§7): 전문가의 `goal.push_directions`는 **선택**만 거르고,
  # 그런 후보만 남는 틱은 `not_executable`로 hold∉A 규칙(A={hold}, unknown=적합 집합)을 받는다 — 후보를 지우면 같은 틱이
  # `goal_candidate_missing`이 되어 모델이 "적합한 것이 없다"고 배운다. K≤12에서 ±y 후보가 9자리 중 1~2자리를 쓰는 비용은
  # 그 구분의 값으로 받아들인다(리뷰 1 M3). 실행기가 옆면 접촉 자세를 얻으면 전문가 목록에 ±y를 더한다.
  push_directions: ["+x", "-x", "+y", "-y"]
  # 실행 가능성은 **기하 나이**로만 정한다 (docs/08 §3.2). 가시 비율은 정보다. 파지·놓기·밀기
  # 국면(팔이 대상을 가린다)과 들고 있는 물체는 이 문턱을 적용하지 않는다.
  max_geometry_age_ms: 500
  approach_clearance_mm: 60  # 접근 지점의 여유 (윗면 위)
  # 파지점: 그립 사이트가 물체 윗면 **아래** 이만큼. Panda 손가락 패드는 그립 사이트 기준
  # 아래 4mm·위 12mm에 걸쳐 있으므로 윗면 위에서 닫으면 아무것도 잡지 못한다 (측정값).
  grasp_depth_mm: 10
  place_clearance_mm: 10     # 놓기점: 든 물체의 바닥이 작업면 위 이만큼 오는 높이
  # 놓기점은 고정된 영역 중심이 아니라 **영역 안의 빈 자리**다 (h0.5, 리뷰 2 C2): 중심에서 가까운 격자점(`place_grid_mm`) 가운데
  # 든 물체의 바닥 자국(OBB xy 외접 반지름 — 회전한 상자에도 안전한 값)이 관측된 다른 물체의 자국과 `place_margin_mm` 이상 떨어지고,
  # 물체 중심이 영역 경계에서 `place_zone_inset_mm` 안쪽이며(완료 판정은 중심이 영역 안인 것이다; 놓인 뒤의 흔들림 여유), 그 자리로의
  # 수직 하강 구간이 구간 대조(외접 구 + planner.margin_mm)에 걸리지 않는 첫 자리다. 빈 자리가 없으면 중심을 목표로 두되
  # `place.free = false`로 표시하고 이동·놓기 명령은 hold + `conflict{zone_full}`이다. 놓기 높이는 든 물체의 **관측된 바닥**(앞단이
  # 말단 + 파지 오프셋으로 채운다)이 작업면 위 `place_clearance_mm`에 오는 말단 높이이며 공칭(윗면 아래 grasp_depth_mm 파지)에서
  # `place_height_slack_mm`까지만 벗어난다. 영역 300×180mm에 56mm 물체 하나가 중심에 있으면 두 번째 자리는 중심에서 ≈90mm다.
  place_margin_mm: 10        # 든 물체 자국과 이웃 자국 사이의 최소 간격
  place_zone_inset_mm: 20    # 놓기점(물체 중심)이 영역 경계에서 떨어지는 최소 거리
  place_grid_mm: 10          # 빈 자리를 찾는 격자 간격
  place_height_slack_mm: 30  # 관측된 바닥으로 정한 놓기 높이가 공칭에서 벗어날 수 있는 최대치
  # 밀기 접촉점: 말단이 물체 표면에서 접근 축 방향으로 떨어지는 거리 = **닫힌 그리퍼가 그 축으로 뻗은 길이 + 여유** (h0.6, 리뷰 1 §d).
  # 실측(`Environment.gripper_extent_mm`, 검사가 대조): 닫힌 손가락은 말단에서 +x 12·−x 17·±y 30mm, 손몸통(말단 위 22mm부터)은 +x 28·
  # −x 47·±y 106mm 뻗어 있다. 물체 윗면이 손몸통 바닥(push 높이 + `push_hand_bottom_mm`)보다 `push_hand_overlap_mm`보다 더 높으면 손몸통이
  # 먼저 닿으므로 `hand`의 값(손몸통 도달 + 5)을, 아니면 손가락이 미는 `fingers`의 값(손가락 도달 + 18; x축은 손몸통 도달 + 5도 넘긴다)을
  # 쓴다. 옛 값 30은 ±y에서 손가락 여유 0·손몸통 겹침 최대 76mm였다. batch-0 전체 sweep(9,880) 실측: ±y 접근 중 충돌(contact_force)은
  # 손몸통이 윗면과 겹치는 물체에서만 났고(+y 134/688 vs 0/320, −y 111/544 vs 6/248) 겹침 ≤ 6mm(상자·낮은 원통)는 충돌 4~8 %·성공
  # 41~71 %, 겹침 > 6mm(키 큰 원통)는 충돌 19~42 %·성공 9~21 %다 — 그래서 겹침 6mm까지는 손가락 밀기를 두고 그 위만 손몸통 밀기다
  # (batch-0의 같은 200 키프레임·3,368 밀기 job·paired seed의 A/B — `scripts/push_contact_ab.py`, 결과 `artifacts/reports/
  # d1-robot-push-contact-ab.json`, 팔 old_30mm(스칼라 30) / h0.6 / h0.7: ±y 접근 중 충돌 251 → 59, 성공 1,645 → 1,679 → 1,676;
  # +y 602 → 548 → 585, −y 263 → 390 → 369, +x 777 → 741 → 722).
  push_contact_mm:
    fingers: {"+x": 33, "-x": 52, "y": 48}
    hand: {"+x": 33, "-x": 52, "y": 111}
  # 닫힌 그리퍼가 그 축으로 **실제로** 뻗은 길이(실측 `Environment.gripper_extent_mm`, 검사가 1mm 안에서 대조; h0.7). 접촉 거리와의
  # 차이가 stand-off 여유(slack)다: 명령한 밀기 구간은 접촉점에서 시작하므로 손가락·손몸통은 slack만큼 간 뒤에야 물체에 닿고 물체는
  # 구간에서 그만큼 덜 간다(y 손가락 18·손몸통 5, +x 손가락 21·−x 손가락 35, 손몸통 x 5mm — h0.6 batch-0 재실행에서 ±y 손가락 밀기의
  # `push_horizon` 실패 116·180건의 변위 중앙값이 20·26mm였다, 리뷰 2 N7). 하네스는 명령 구간을 `push_segment_mm + slack`으로 늘리고
  # 성공 기준(사건 `segment_fraction × push_segment_mm` = 40mm)·완료 판정(변위 ≥ `push_segment_mm`)은 절대값 그대로 둔다. 같은 3,368
  # job의 A/B(h0.6 → h0.7): 겨냥한 +y 손가락 밀기는 horizon 실패 116 → 78, 성공 460 → 496(704 job); 다른 부위·축은 접촉 혼돈의 띠 안에서
  # 움직였고(−y 손가락 238 → 213, +x 손가락 512 → 492, 손몸통 ±0~4; 옛 A/B에서 3mm 오프셋 변화가 +x를 777 → 741 움직였다) 전체 1,679 → 1,676.
  push_reach_mm:
    fingers: {"+x": 12, "-x": 17, "y": 30}
    hand: {"+x": 28, "-x": 47, "y": 106}
  push_hand_bottom_mm: 22    # 손몸통 바닥의 말단 위 높이 (실측 21.9)
  push_hand_overlap_mm: 6    # 손몸통이 윗면과 이만큼까지 겹치는 물체는 손가락으로 민다
  push_segment_mm: 80        # 밀기 한 구간의 길이 = 물체가 가야 할 변위 (완료 판정에도 쓴다; 명령 구간은 여기에 slack을 더한다)
  # 밀기 높이 = max(물체 중간 높이, 작업면 + 이 값). 닫힌 손가락 끝은 그립 사이트 아래 4mm이고 하강 끝의 추종
  # 오차가 10mm쯤이라 그보다 낮으면 손가락이 작업면을 친다(3c-2 실측: 32mm 상자의 중간 높이에서 230N).
  push_height_min_mm: 25

# 국소 경유점 플래너 (docs/08 §4 `q_path`).
planner:
  max_waypoints: 3           # n≤3
  margin_mm: 25              # 직선 구간과 물체 OBB 사이의 여유
  # 금지 접촉 물체는 이만큼 더 큰 여유를 가진 장애물이다 (구간 대조·경유점 계획 모두). 그래서
  # 금지 물체 곁의 direct는 먼저 경유 경로로 바뀌고(`conflict{forbidden_reroute}`), 경유 경로가
  # 없을 때만 hold+`forbidden_segment`로 실행기가 정지 전이한다 (docs/08 §5.6).
  forbidden_margin_mm: 60
  over_clearance_mm: 60      # 위로 넘어가는 경유점의 물체 윗면 여유
  side_offset_mm: 90         # 옆으로 도는 경유점의 가로 이동량

# 조합 규칙 v0 (docs/08 §5).
compose:
  delta: 0.15                # 전환 여유 δ
  m: 2                       # 같은 도전자가 이어져야 하는 틱 수
  tolerance:                 # 의미 키의 연속 파라미터 허용 오차
    distance_mm: 50
    clearance_mm: 10
  gates:                     # 이진 답을 게이트로 읽는 임계값
    done: 0.5
    instr: 0.5
    observe: 0.5
    retry: 0.5
    stop: 0.5
  initial_profile:           # 전환 틱에 적용하는 새 후보의 초기 프로파일 (docs/08 §5.4)
    path: direct
    speed_level: 1
    force_level: 0
  fragile_proximity_mm: 120  # 취약 물체가 이 안이면 속도 수준을 내린다
  fragile_speed_cap: 1
  forbidden_proximity_mm: 60 # 금지 물체가 이 안이면 힘 수준을 회피로 묶는다
  observe_ticks: 3           # 관측·보류 후보의 완료 판정 (무한 반복 방지)
  hold_ticks: 3
  # 놓기 정체 감시 (h0.6, 리뷰 1 I6): 놓기 국면에서 실행기가 `gripper_wait: readiness`로 기다리는 틱이 연속 `m_place`에 이르고
  # 그동안 말단이 `place_progress_mm` 이상 내려가지 못하면(보이지 않는 받침·틀린 파지 오프셋·작업면에 눌린 하중) `place_stalled`로
  # 적고 commitment를 풀며 그 놓기점 둘레 `place_stall_exclusion_mm`의 격자점을 그 에피소드 동안 제외한다 — 다음 채택은 다른 자리로
  # 내려간다(반경은 보이지 않는 받침의 자국 + 든 물체의 자국 규모: 물체 자국 ≤ 40 + 여유). 옛 규칙(중심 고정)의 E1 seed 13은 96틱을
  # 그 자리에서 기다렸다; 진행 장부는 15틱 뒤 풀고 자리를 바꾼다(검사 `test_the_stall_guard_frees_seed_13_under_the_old_centre_rule`) —
  # 단, 접촉 중 OSC가 말단을 틱마다 0.1~0.4mm 가라앉히는 creep(seed 13 궤적 −8 → −17mm/24틱)은 진행 장부를 계속 새로 세게 해 실제
  # 대기는 31틱이었고 0.13mm/틱 이상이면 영원히 미뤄진다(리뷰 2 N2). 그래서 h0.7은 진행과 무관한 **절대 상한** `m_place_total`
  # (3 × m_place)을 둔다: 연속 readiness 대기 틱이 그 수에 이르면 `place_stalled`다(기록의 `cap`이 progress/total을 말한다).
  m_place: 15
  m_place_total: 45
  place_progress_mm: 2
  place_stall_exclusion_mm: 60

# 국면 판정과 국면별 목표점 (docs/08 §3.2 `commitment`의 국면, §5.6).
#   approach → 접근점, grasp → 파지점, lift → 현재 XY에서 이동 높이까지 수직 상승,
#   transport → 목적지 위 접근점(이동 높이 유지), place → 놓기점으로 하강, push → 접촉점·밀기 구간.
# 이동 높이 = max(현재 말단 높이, 목적지 접근점 높이, 작업면 위에 놓인 물체를 파지점에서
# `lift_height_mm`만큼 든 높이). 들고 있는 물체의 바닥이 작업면 위 물체(≤80mm)를 넘는다.
phases:
  grasp_distance_mm: 80      # 파지점에 이만큼 들어오면 approach → grasp
  # …단, xy도 파지점에 이만큼 정렬돼 있어야 한다. 접근점(윗면+60)과 파지점(윗면−10)은 어떤 물체든 70mm
  # 떨어져 있어 거리 조건만으로는 xy가 최대 38mm 벗어난 채 파지 국면에 들어가고, 키 큰 원통에서는 그
  # 대각선 하강이 손가락 패드로 윗면 모서리를 누른다(3c-1 E0 seed 101, 접촉력 58~67N).
  grasp_xy_tolerance_mm: 10
  # …그리고 말단이 접근점에서 멈춰야 한다. 80mm 경계는 접근점보다 10mm 위라 접근 속도(2단계)를 안은 채
  # 넘어오며, 그 가로 관성이 하강 첫 200ms에 20~30mm를 흘려 좁은 원통의 테두리를 짚는다.
  grasp_entry_speed_mm_s: 60
  lift_height_mm: 120        # 파지점에서 이만큼 올린 높이가 이동 높이
  height_tolerance_mm: 15    # 이동 높이에 이만큼 들어오면 lift → transport (추종 오차 흡수)
  place_tolerance_mm: 60     # 목적지 중심에 이만큼 들어오면 transport → place
  push_contact_mm: 40        # 접촉점에 이만큼 들어오면 approach → push
  # …단, 말단이 이 속도 아래로 잦아든 뒤에. 하강 속도를 안은 채 임피던스가 밀기(부드러움)로 바뀌면 z가 15mm
  # 처져 손가락이 작업면을 친다(3c-2 실측 113~144N). 파지 진입(60)보다 느슨한 것은 밀기 horizon(3초) 때문이다.
  push_entry_speed_mm_s: 120

# 토큰 직렬화의 변화분 규칙 (docs/08 §3.1, 계약 v0.3). 모델 쪽 `robo_jev.model.serialize.DELTA_RULES`와 같아야 한다
# (검사가 대조한다) — 값은 여기가 적고 레코드의 `config_digest`에 든다. 물체 소개 줄(정적 필드)은 시작·처음 관측·정적 필드
# 변경·`object_intro_period_ticks`(윈도우 길이)마다, 동적 줄은 변화(자세 > max(정밀도 s, object_pose_delta_mm), 회전, 가시
# 비율 변화 ≥ object_visibility_delta, 관측 정지의 시작·끝, 재식별, 들고 있는 물체) 또는 `object_dynamic_period_ticks`마다,
# 지시 텍스트는 `goal_text_period_ticks`마다 다시 싣는다(그 밖에는 goal 줄의 압축 참조만).
serialization:
  object_intro_period_ticks: 30
  object_dynamic_period_ticks: 10
  goal_text_period_ticks: 10
  object_pose_delta_mm: 0
  object_visibility_delta: 0.25

# 명령 생성 (docs/08 §6).
command:
  frame: robot_base
  request_id_prefix: r
