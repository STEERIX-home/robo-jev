# v0.1 본 run ①(pod 하나): v0.1a의 train-50k(학습 문구 넓히기 + 사실 순서 섞기) 1 epoch — 학습 설정은 v0과 같다(decisions-v0-lora-h100:
# 2B LoRA bf16 + fp32 master, λ 0.2, p3, 마지막 체크포인트) → 학습한 2B로 일반 능력 시험 G1(봉인, Task v0.1b)과 봉인 시험 세트 T1~T7 진단
# (균형 배치, 두 읽기). 기준(학습 없는 2B)과 v0의 G1은 Spark에서 같은 진단 도구 판(v0d-diagnose-4)·같은 프롬프트(v0c-p3)로 이미 쟀다
# (artifacts/reports/v01b/G1-{base,v0}-2b.*) — pod에서 다시 재지 않는다. 비교(--compare, convert_single_probe.py compare)는 Spark에서 CPU로.
# G1을 T1~T7보다 앞에 둔다(짧고, 새 측정이다). T6의 단계 상한은 v0의 실측(53.8분)이 60분에 가까워 90분으로 둔다.
kind: robojev-cloud-job-v0
name: decisions-v01-main-h100
job:
  kind: decisions
  model: Qwen/Qwen3.5-2B
  inputs:
    - artifacts/simgen/v01/train-50k.jsonl
    - artifacts/simgen/v0b/tests/T1.jsonl
    - artifacts/simgen/v0b/tests/T2.jsonl
    - artifacts/simgen/v0b/tests/T3.jsonl
    - artifacts/simgen/v0b/tests/T4.jsonl
    - artifacts/simgen/v0b/tests/T5.jsonl
    - artifacts/simgen/v0b/tests/T6.jsonl
    - artifacts/simgen/v0b/tests/T7.jsonl
    - artifacts/simgen/v0b/tests/manifest.json
    - artifacts/simgen/probes/G1.jsonl
    - artifacts/simgen/probes/G1.manifest.json
  runtime:
    env:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HF_HUB_DISABLE_TELEMETRY: "1"
  setup:
    - name: sync
      argv: ["{uv}", "sync", "--frozen", "--group", "backbone"]
      fallback: ["{uv}", "sync", "--frozen", "--group", "backbone", "--no-install-package", "evdev"]
      max_minutes: 15
      est_minutes: 1.5
      env: {UV_LINK_MODE: copy, UV_PYTHON_DOWNLOADS: automatic}
  steps:
    - name: env
      argv: ["{python}", "-m", "robo_jev.launch.envprobe", "--out", "{reports}/env.json"]
      max_minutes: 3
      est_minutes: 0.3
    - name: weights
      argv: ["{python}", "scripts/fetch_backbone.py", "--from-manifest", "artifacts/models/manifest.json", "--id", "{model}"]
      max_minutes: 10
      est_minutes: 0.5
    - name: train
      argv: ["{python}", "scripts/train_decisions.py", "train", "--config", "configs/train/decisions-v0-lora-h100.yaml",
             "--set", "train_input=artifacts/simgen/v01/train-50k.jsonl", "--set", "out_dir={runs}", "--set", "run_name=v01-main-2b",
             "--gpu-memory-fraction", "0.92"]
      wall_set: max_wall_hours
      max_minutes: 300
      est_minutes: 66
    - name: after-G1
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v01-main-2b/checkpoint.pt", "--input", "artifacts/simgen/probes/G1.jsonl", "--out", "{reports}/after-v01-2b-G1.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 45
      est_minutes: 20
      optional: true
    - name: after-T1
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v01-main-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T1.jsonl", "--out", "{reports}/after-v01-2b-T1.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 27
      optional: true
    - name: after-T2
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v01-main-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T2.jsonl", "--out", "{reports}/after-v01-2b-T2.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 27
      optional: true
    - name: after-T3
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v01-main-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T3.jsonl", "--out", "{reports}/after-v01-2b-T3.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 26
      optional: true
    - name: after-T4
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v01-main-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T4.jsonl", "--out", "{reports}/after-v01-2b-T4.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 15
      optional: true
    - name: after-T5
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v01-main-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T5.jsonl", "--out", "{reports}/after-v01-2b-T5.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 14
      optional: true
    - name: after-T6
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v01-main-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T6.jsonl", "--out", "{reports}/after-v01-2b-T6.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 90
      est_minutes: 54
      optional: true
    - name: after-T7
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v01-main-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T7.jsonl", "--out", "{reports}/after-v01-2b-T7.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 27
      optional: true
  fetch:
    - runs/*/metrics.json
    - runs/*/config.yaml
    - runs/*/checkpoint.pt
    - reports/*
provider:
  name: runpod
  gpu_type: NVIDIA H100 80GB HBM3
  gpu_count: 1
  cloud: SECURE
  image: runpod/base:1.4.0-cuda1300-ubuntu2404
  min_cuda_version: "13.0"
  disk_gb: 100
  boot_timeout_minutes: 15
  fetch_reserve_minutes: 8
  delete_margin_minutes: 2
  start_grace_minutes: 30
  done_grace_minutes: 30
budget:
  hourly_usd: 3.99
  max_wall_hours: 6
  max_usd: null
  price_source: "RunPod v2 카탈로그 (launch 직전 대조)"
  phase: {name: cloud-phase-1, cap_usd: 150}
estimate:
  boot_minutes: 3
  uplink_mbps: 40
  fetch_minutes: 3
  assumption: "단계 시간은 v0 본 run(v0-main-01, H100)의 실측: 학습 62.6분, 진단 T1 26.3 · T2 26.1 · T3 25.4 · T4 14.7 · T5 13.2 · T6 53.8 · T7 26.7분; G1은 같은 처리량(≈ 7,700 토큰/s, 9.0 M 토큰)으로 ≈ 20분"
