# v0.3 (one pod): the v0.1-mix recipe with v0.3 data — Task v0.3c §1-4. Training config unchanged (decisions-v0-lora-h100: 2B LoRA bf16 +
# fp32 master, λ 0.2, prompt v0c-p3, 1 epoch, final checkpoint); only train_input and run_name differ from v0.1-mix (and v0.2).
# Training input artifacts/simgen/v03/train-v03.jsonl, built on this box (manifest train-v03.manifest.json; recipe in the v0.3c report):
#   python scripts/system1_v03.py transform --input artifacts/simgen/v02/train-50k.jsonl --out artifacts/simgen/v03/engine-s1.jsonl
#   python scripts/convert_single_probe.py mix --base artifacts/simgen/v03/engine-s1.jsonl --extra mujoco=artifacts/simgen/v03/mujoco-train.jsonl \
#       --extra-share mujoco=0.20 --probe artifacts/simgen/probes/G1-train-mix.jsonl --sealed artifacts/simgen/probes/G1.jsonl --general artifacts/simgen/v02/general-train.jsonl \
#       --general-share 0.25 --general-repeat-if-short --train-config configs/train/decisions-v0-lora-h100.yaml --token-sample 3000 \
#       --out artifacts/simgen/v03/train-v03.jsonl
#   python scripts/system1_v03.py overlap --input artifacts/simgen/v03/train-v03.jsonl --out artifacts/simgen/v03/train-v03.overlap.json
# = engine physics set (v02 train-50k + System-1 derived questions; first, so the trainer's dev set is the engine's) + MuJoCo physical-factor
# set (Task v0.3b) + d1 train mix ×1 + general reading (v0.2 general-train, 25 % of train examples per epoch as v0.2-b; narrated data held
# back per E1).
# Diagnoses on the job's own checkpoint (after-v03-2b-*), first the sets the PRE-DECLARED v0.3 VERDICT RULE reads — T8b (O), G2 (G),
# T2–T4 (H) — then the secondary ones: T1, T5, T7, T8a, G1, T6; so a slow pod can only cut secondary readings. T8 files are final (sealed,
# our own) and go up as regular inputs. No base step: the rule's untrained base on T8b is the T8 task's Spark run
# (artifacts/reports/t8/T8b-base-2b, same prompt / format / orders / seed, GB10 hardware — scripts/verdict_v03.py notes it) and the base on
# G2 is the v0.1 main pod's (base-2b-G2, H100). Apply the rule with scripts/verdict_v03.py on the fetched reports.
# Built (2026-10-12, code 56eec1e): 116,912 records = engine 50,000 + MuJoCo 14,998 + a recorded MuJoCo second pass of 3,704 (1,852 whole
# pairs, round-robin over tilt / grip / tower — 14,998 records give 16.9 % of examples, short of the 20–30 % target) + d1 1,439 + general
# 46,771 (all 35,000 + a recorded second pass over the first 11,771 — the file alone cannot reach 25 %); examples per epoch 183,230 =
# engine 98,050 (53.5 %) · MuJoCo 36,648 (20.0 %) · d1 2,724 (1.5 %) · general 45,808 (25.0 %); 5,726 steps; sampled tokens ≈ 63.7 M
# (engine 62 % · MuJoCo 19 % · d1 4 % · general 15 %); sha256 bd37b76b4da70e2ac6a1cad03651dfcd91299ab71da123eb45d1430caa992659.
kind: robojev-cloud-job-v0
name: decisions-v03-h100
job:
  kind: decisions
  model: Qwen/Qwen3.5-2B
  inputs:
    - artifacts/simgen/v03/train-v03.jsonl
    - artifacts/t8/T8b.jsonl
    - artifacts/t8/T8b.manifest.json
    - artifacts/simgen/probes/G2.jsonl
    - artifacts/simgen/probes/G2.manifest.json
    - artifacts/simgen/v0b/tests/T1.jsonl
    - artifacts/simgen/v0b/tests/T2.jsonl
    - artifacts/simgen/v0b/tests/T3.jsonl
    - artifacts/simgen/v0b/tests/T4.jsonl
    - artifacts/simgen/v0b/tests/T5.jsonl
    - artifacts/simgen/v0b/tests/T6.jsonl
    - artifacts/simgen/v0b/tests/T7.jsonl
    - artifacts/simgen/v0b/tests/manifest.json
    - artifacts/t8/T8a.jsonl
    - artifacts/t8/T8a.manifest.json
    - artifacts/simgen/probes/G1.jsonl
    - artifacts/simgen/probes/G1.manifest.json
  runtime:
    env:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HF_HUB_DISABLE_TELEMETRY: "1"
  setup:
    - name: sync
      argv: ["{uv}", "sync", "--frozen", "--group", "backbone"]
      fallback: ["{uv}", "sync", "--frozen", "--group", "backbone", "--no-install-package", "evdev"]
      max_minutes: 15
      est_minutes: 1.5
      env: {UV_LINK_MODE: copy, UV_PYTHON_DOWNLOADS: automatic}
  steps:
    - name: env
      argv: ["{python}", "-m", "robo_jev.launch.envprobe", "--out", "{reports}/env.json"]
      max_minutes: 3
      est_minutes: 0.3
    - name: weights
      argv: ["{python}", "scripts/fetch_backbone.py", "--from-manifest", "artifacts/models/manifest.json", "--id", "{model}"]
      max_minutes: 10
      est_minutes: 0.5
    - name: train
      argv: ["{python}", "scripts/train_decisions.py", "train", "--config", "configs/train/decisions-v0-lora-h100.yaml",
             "--set", "train_input=artifacts/simgen/v03/train-v03.jsonl", "--set", "out_dir={runs}", "--set", "run_name=v03-2b",
             "--gpu-memory-fraction", "0.92"]
      wall_set: max_wall_hours
      max_minutes: 300
      est_minutes: 125
    - name: after-T8b
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/t8/T8b.jsonl", "--out", "{reports}/after-v03-2b-T8b.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 30
      est_minutes: 8
      optional: true
    - name: after-G2
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/simgen/probes/G2.jsonl", "--out", "{reports}/after-v03-2b-G2.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 20
      est_minutes: 3
      optional: true
    - name: after-T2
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T2.jsonl", "--out", "{reports}/after-v03-2b-T2.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 27
      optional: true
    - name: after-T3
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T3.jsonl", "--out", "{reports}/after-v03-2b-T3.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 26
      optional: true
    - name: after-T4
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T4.jsonl", "--out", "{reports}/after-v03-2b-T4.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 15
      optional: true
    - name: after-T1
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T1.jsonl", "--out", "{reports}/after-v03-2b-T1.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 27
      optional: true
    - name: after-T5
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T5.jsonl", "--out", "{reports}/after-v03-2b-T5.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 14
      optional: true
    - name: after-T7
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T7.jsonl", "--out", "{reports}/after-v03-2b-T7.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 27
      optional: true
    - name: after-T8a
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/t8/T8a.jsonl", "--out", "{reports}/after-v03-2b-T8a.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 30
      est_minutes: 5
      optional: true
    - name: after-G1
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/simgen/probes/G1.jsonl", "--out", "{reports}/after-v03-2b-G1.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 45
      est_minutes: 10
      optional: true
    - name: after-T6
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v03-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T6.jsonl", "--out", "{reports}/after-v03-2b-T6.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 90
      est_minutes: 54
      optional: true
  fetch:
    - runs/*/metrics.json
    - runs/*/config.yaml
    - runs/*/checkpoint.pt
    - reports/*
provider:
  name: runpod
  gpu_type: NVIDIA H100 80GB HBM3
  gpu_count: 1
  cloud: SECURE
  image: runpod/base:1.4.0-cuda1300-ubuntu2404
  min_cuda_version: "13.0"
  disk_gb: 100
  boot_timeout_minutes: 15
  fetch_reserve_minutes: 8
  delete_margin_minutes: 2
  start_grace_minutes: 30
  done_grace_minutes: 30
budget:
  hourly_usd: 3.99
  max_wall_hours: 6.5
  max_usd: null
  price_source: "RunPod v2 카탈로그 (launch 직전 대조)"
  phase: {name: cloud-phase-1, cap_usd: 150}
estimate:
  boot_minutes: 3
  uplink_mbps: 40
  fetch_minutes: 3
  assumption: "Train from v0.2-b's pod (H100, same recipe): 4,199 steps in 87.8 min (1.13 s/step steady, ≈ 48.9 M prompt tokens). This input has 5,726 steps (+36 %) and ≈ 63.7 M sampled prompt tokens (+30 %), and its 300 dev records carry the derived questions (≈ +65 % dev prompts over 13 dev passes), so train ≈ 120 min scaled by steps (the larger of the two) + ≈ 5 min of longer dev passes = 125 min. Diagnoses = the slower measured pods (v0.1 / v0.2-b): G2 3, T1 27, T2 27, T3 26, T4 15, T5 14, T7 27, G1 10, T6 54 min; T8b ≈ 8 and T8a ≈ 5 min (3,600 / 3,676 prompts — G2's 2,500 took 2.0–2.7 min). The wall cap is 6.5 h (v0.2: 6 h) so the plan keeps ≥ 30 min of slack with every diagnosis; at 6 h the last, secondary T6 could be cut on a slow pod."
