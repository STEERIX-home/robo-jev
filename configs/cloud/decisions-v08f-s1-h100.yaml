# v0.8 arm F (FORMAT), seed 1 (one pod): v0.7's job decisions-v07-s1-h100 with the v0.8 training input — Task v0.8a §1.4. Arm F trains the FORMAT
# package alone. Training config otherwise v0.7's (decisions-v0-lora-h100: 2B LoRA bf16 + fp32 master, λ 0.2, prompt v0c-p3, 1 epoch, final
# checkpoint, questions_per_request 2); the 255-option opt-in and the assigned codes ride in the data (meta.option_range, meta.codes). The other arm
# (decisions-v08p-s1-h100) trains the same input file; the two arms differ only by the H-prior option. It is the seed-0 job of this arm with the
# training seed 1 (`--set seed=1`: LoRA init, data order, question picks and option-order augmentation) and its own run name — nothing else differs.
# Training input artifacts/simgen/v08/train-v08.jsonl (sha256 bffd74941495…), built on this box in one command (recipe in the v0.8a report):
#   python scripts/assemble_v08.py all --out-dir artifacts/simgen/v08
# = v0.7's input (train-v07.jsonl, sha256 20dd9bfc…) with the FORMAT package (PRE-DECLARED v0.8 VERDICT RULE): v0.7's expanded questions (≈ 8 % of
# the physics choice questions, ≈ 8 % of the general records) re-expanded with N log-uniform over 9..255 (fewer where v0.7's distractor rules run
# out of keys), expanded general items re-keyed o1…oN, ≈ 25 % of all choice questions shown with random codes from the 255-code pool; labels, ids,
# order, v0.7's sheets and facts and every untouched line unchanged, so the trainer's exposure per seed is v0.7's (seed 0 201,781 examples, 6,306
# steps; seed 1 201,856, 6,308). Sealed checks 0 hits: T1–T7, G1, G2, T8a, T8b, T9, B1, the H-set, A4, the iface M1 / M2 sets, M2g, M1g and M2g-F.
# Diagnoses on the job's own checkpoint (after-v08f-s1-2b-*), v0.7's order: T2, T3, T4, G2, T1, T5, T7, then T8a, G1 and, last, T6. NOT on the pod:
# M8g, B8, A4, T9, T8b, the H-set, B1, M1g, M2g — scored on Spark, none of them uploaded. Train time from scripts/assemble_v08.py exposure: every
# epoch-0 step's padded tokens simulated with the trainer's own packing (micro_batch_tokens 16,384) × v0.7's measured seconds per padded token, +
# v0.7's dev and load minutes, + 10 % for the longer sequences: s0 222 min, s1 224 min (tokens ×1.056, padded tokens ×1.038 vs v0.7) → est 225 min,
# step cap 360 min. Upload ≈ 28 min at v0.7's measured ≈ 5 Mbit/s. Wall cap 10.5 h: the plan + ≥ 60 min of slack; cap $41.90 at $3.99/h (≤ $45).
# Phase cloud-phase-1 at $500: the four v0.8 runs' caps on top of what the ledger has spent.
kind: robojev-cloud-job-v0
name: decisions-v08f-s1-h100
job:
  kind: decisions
  model: Qwen/Qwen3.5-2B
  inputs:
    - artifacts/simgen/v08/train-v08.jsonl
    - artifacts/simgen/probes/G2.jsonl
    - artifacts/simgen/probes/G2.manifest.json
    - artifacts/simgen/v0b/tests/T1.jsonl
    - artifacts/simgen/v0b/tests/T2.jsonl
    - artifacts/simgen/v0b/tests/T3.jsonl
    - artifacts/simgen/v0b/tests/T4.jsonl
    - artifacts/simgen/v0b/tests/T5.jsonl
    - artifacts/simgen/v0b/tests/T6.jsonl
    - artifacts/simgen/v0b/tests/T7.jsonl
    - artifacts/simgen/v0b/tests/manifest.json
    - artifacts/t8/T8a.jsonl
    - artifacts/t8/T8a.manifest.json
    - artifacts/simgen/probes/G1.jsonl
    - artifacts/simgen/probes/G1.manifest.json
  runtime:
    env:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HF_HUB_DISABLE_TELEMETRY: "1"
  setup:
    - name: sync
      argv: ["{uv}", "sync", "--frozen", "--group", "backbone"]
      fallback: ["{uv}", "sync", "--frozen", "--group", "backbone", "--no-install-package", "evdev"]
      max_minutes: 15
      est_minutes: 1.5
      env: {UV_LINK_MODE: copy, UV_PYTHON_DOWNLOADS: automatic}
  steps:
    - name: env
      argv: ["{python}", "-m", "robo_jev.launch.envprobe", "--out", "{reports}/env.json"]
      max_minutes: 3
      est_minutes: 0.3
    - name: weights
      argv: ["{python}", "scripts/fetch_backbone.py", "--from-manifest", "artifacts/models/manifest.json", "--id", "{model}"]
      max_minutes: 10
      est_minutes: 0.5
    - name: train
      argv: ["{python}", "scripts/train_decisions.py", "train", "--config", "configs/train/decisions-v0-lora-h100.yaml",
             "--set", "train_input=artifacts/simgen/v08/train-v08.jsonl", "--set", "out_dir={runs}", "--set", "run_name=v08f-s1-2b",
             "--set", "seed=1",
             "--gpu-memory-fraction", "0.92"]
      wall_set: max_wall_hours
      max_minutes: 360
      est_minutes: 225
    - name: after-T2
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T2.jsonl", "--out", "{reports}/after-v08f-s1-2b-T2.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 27
      optional: true
    - name: after-T3
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T3.jsonl", "--out", "{reports}/after-v08f-s1-2b-T3.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 26
      optional: true
    - name: after-T4
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T4.jsonl", "--out", "{reports}/after-v08f-s1-2b-T4.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 15
      optional: true
    - name: after-G2
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/simgen/probes/G2.jsonl", "--out", "{reports}/after-v08f-s1-2b-G2.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 20
      est_minutes: 3
      optional: true
    - name: after-T1
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T1.jsonl", "--out", "{reports}/after-v08f-s1-2b-T1.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 27
      optional: true
    - name: after-T5
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T5.jsonl", "--out", "{reports}/after-v08f-s1-2b-T5.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 14
      optional: true
    - name: after-T7
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T7.jsonl", "--out", "{reports}/after-v08f-s1-2b-T7.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 60
      est_minutes: 27
      optional: true
    - name: after-T8a
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/t8/T8a.jsonl", "--out", "{reports}/after-v08f-s1-2b-T8a.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 30
      est_minutes: 5
      optional: true
    - name: after-G1
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/simgen/probes/G1.jsonl", "--out", "{reports}/after-v08f-s1-2b-G1.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 45
      est_minutes: 10
      optional: true
    - name: after-T6
      argv: ["{python}", "scripts/diagnose_decisions.py", "--model", "{model}", "--checkpoint", "{runs}/v08f-s1-2b/checkpoint.pt", "--input", "artifacts/simgen/v0b/tests/T6.jsonl", "--out", "{reports}/after-v08f-s1-2b-T6.json", "--gpu-memory-fraction", "0.92"]
      max_minutes: 90
      est_minutes: 54
      optional: true
  fetch:
    - runs/*/metrics.json
    - runs/*/config.yaml
    - runs/*/checkpoint.pt
    - reports/*
provider:
  name: runpod
  gpu_type: NVIDIA H100 80GB HBM3
  gpu_count: 1
  cloud: SECURE
  image: runpod/base:1.4.0-cuda1300-ubuntu2404
  min_cuda_version: "13.0"
  disk_gb: 100
  boot_timeout_minutes: 15
  fetch_reserve_minutes: 8
  delete_margin_minutes: 2
  start_grace_minutes: 30
  done_grace_minutes: 30
budget:
  hourly_usd: 3.99
  max_wall_hours: 10.5
  max_usd: null
  price_source: "RunPod v2 카탈로그 (launch 직전 대조)"
  phase: {name: cloud-phase-1, cap_usd: 500}
estimate:
  boot_minutes: 3
  uplink_mbps: 5
  fetch_minutes: 3
  assumption: "Train from the padded-token simulation of this input (scripts/assemble_v08.py exposure → train-v08.exposure.json `time_and_budget`): v0.7's pods measured 10,923 / 11,012 s of training steps for 182.50 / 182.63 M padded tokens (+ 11 min of dev passes and 2 min of loading); this input's epoch-0 steps hold ×1.038 the padded tokens (×1.056 the tokens), so train ≈ 222 / 224 min including a 10 % margin for the longer sequences' attention, rounded up to 225; the dev passes read the same 300 untransformed engine dev records. Upload at 5 Mbit/s (v0.7's pods: 950 MB in ≈ 26 min). Diagnoses = v0.7's job (measured on v0.7's pods: T2 22, T3 21, T4 12, G2 2, T1 21, T5 11, T7 21, T8a 3, G1 7, T6 43 min; the estimates keep v0.7's rounded-up values). No M8g, B8, A4, T9, T8b, B1, H-set, M1g or M2g on the pod (Spark). The 10.5 h wall cap keeps ≥ 60 min of slack for a slow pod; the train step may run 360 min; cap $41.90."
