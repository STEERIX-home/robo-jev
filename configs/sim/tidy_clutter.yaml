# E0/E1 장면 "어수선한 다물체 정리" — docs/02 §1, docs/05 §2.
#
# 장면·지시 변경·외란은 전부 reset seed에서 만든다. 외란은 **모의 시간**으로 정의하며
# 정책 호출 횟수와 무관하다(docs/05 §2). 모든 수치는 여기에만 둔다.
version: s0.3
default_profile: E1

simulator:
  backend: robosuite
  env_name: TidyClutter
  robot: Panda
  gripper: PandaGripper
  controller_config: configs/controller/osc_v0.yaml
  physics_dt_ms: 2
  control_hz: 50
  # headless. 렌더·카메라는 쓰지 않는다(YAGNI: E2에서 시뮬 3D 카메라를 붙인다).
  has_renderer: false
  has_offscreen_renderer: false

# docs/08 §3.2 직렬화 규약. serializer 버전(`version`)과 함께 고정한다.
serialization:
  position_unit: mm          # 위치는 mm 정수
  quaternion_decimals: 2     # 자세는 quaternion 소수 2자리
  time_unit: ms              # 시간은 ms 정수

table:
  full_size_m: [0.8, 0.8, 0.05]
  friction: [1.0, 0.005, 0.0001]
  offset_m: [0.0, 0.0, 0.8]

objects:
  count_min: 6
  count_max: 10
  shapes: [box, cylinder]
  shape_labels: {box: 상자, cylinder: 원통}   # 지시문에 들어가는 이름
  box_half_size_mm: [16, 28]          # 반변 길이 범위
  cylinder_radius_mm: [16, 26]
  cylinder_half_height_mm: [24, 40]
  density: 500.0
  friction: [0.95, 0.005, 0.0001]
  min_separation_mm: 85               # 중심 간 최소 거리
  # 금지 접촉 물체가 낀 쌍의 최소 간격은 따로다. 하네스는 금지 물체를 "외접 반지름 + planner.margin_mm +
  # planner.forbidden_margin_mm"의 장애물로 보므로(configs/harness/robot.yaml), 그 안에 이웃이 놓이면
  # 채택 → hold+forbidden_segment → forbidden_blocked가 되풀이된다. 85mm는 기본 한계(외접 반지름 + 25 ≈
  # 79mm, 가장 큰 원통)에 5mm 남짓만 남긴다. 수치는 복사하지 않고 하네스 설정에서 읽는다 — 위반한 금지
  # 물체만 다시 놓으므로 위반이 없는 seed의 장면은 그대로다.
  forbidden_separation:
    harness_config: configs/harness/robot.yaml
  spawn_x_mm: [-260, 60]              # 테이블 중심 기준
  spawn_y_mm: [-280, 280]
  spawn_attempts: 400
  fragile_count: [1, 2]
  forbidden_count: [1, 2]
  palette:                            # 색은 물체를 구분하는 설명이다. 이름이 상태에 들어간다
    - {name: red, ko: 빨간, rgba: [0.80, 0.16, 0.16, 1.0]}
    - {name: blue, ko: 파란, rgba: [0.16, 0.34, 0.80, 1.0]}
    - {name: green, ko: 초록, rgba: [0.18, 0.62, 0.30, 1.0]}
    - {name: yellow, ko: 노란, rgba: [0.90, 0.78, 0.18, 1.0]}
    - {name: purple, ko: 보라, rgba: [0.55, 0.26, 0.72, 1.0]}
    - {name: orange, ko: 주황, rgba: [0.92, 0.52, 0.14, 1.0]}
    - {name: cyan, ko: 청록, rgba: [0.18, 0.70, 0.74, 1.0]}
    - {name: pink, ko: 분홍, rgba: [0.90, 0.48, 0.66, 1.0]}
    - {name: brown, ko: 갈색, rgba: [0.45, 0.31, 0.20, 1.0]}
    - {name: grey, ko: 회색, rgba: [0.55, 0.55, 0.57, 1.0]}

zones:
  count_min: 2
  count_max: 3
  candidates:                          # bounds_mm = [x0, y0, x1, y1] (테이블 중심 기준)
    - {id: zoneL, desc: "왼쪽 정리 영역", bounds_mm: [-120, 150, 180, 330]}
    - {id: zoneR, desc: "오른쪽 정리 영역", bounds_mm: [-120, -330, 180, -150]}
    - {id: zoneF, desc: "앞쪽 보관 영역", bounds_mm: [100, -80, 300, 80]}

visibility:
  # 고정 시점에서 물체 윗면 표본을 훑는 가림 근사. 앞단(3D 재구성)이 채울 수 있는 값만 만든다.
  # 시점은 테이블 건너편 위(앞쪽·위)다. 이전 값 [-150, 0, 700]은 홈 자세의 팔 바로 위라 팔 아래
  # 물체가 그늘에 들어갔다(reset에서 보이는 물체 비율 E0 0.57·E1 0.64, 대상 0.60·0.65 — 리뷰 10의
  # E0 폐루프 실패 원인). 이 값은 seed 1..20의 reset에서 E0·E1 모두 물체 100%가 문턱 이상이다.
  viewpoint_mm: [600, 0, 700]          # 테이블 윗면 중심 기준 상대 위치
  samples: 5                            # 중심 + 윗면 네 모서리
  visible_ratio_threshold: 0.6
  inflate_mm: 4.0
  # **자기 가림 이어 들기** (s0.3, Task R1 B2-v). 광선을 막은 것이 로봇의 몸이면 앞단(3D 재구성·추적기)은
  # 로봇의 자세를 알고 있으므로 예측 가능한 결측이고, 그 구간의 **정지한** 물체(마지막 관측 자세에서 이 값
  # 안)는 추적으로 이어 든다 — 기하 나이가 자라지 않는다. 이 값보다 많이 움직였으면 추적이 틀렸으므로
  # 이어 들지 않는다(외란이 자기 가림 중인 물체를 밀면 다시 봐야 한다). 0이면 규칙이 꺼진다.
  #
  # 근거(실측): D1의 `ep-E1-000235`는 157틱을 `observe` 게이트에 묶여 끝났다. 관측 자세([457,0,199])의
  # 팔 `link6`이 카메라(테이블 중심 위 [600,0,700])에서 대상 o2로 가는 광선을 정확히 막아 가시 비율이
  # 0.0에 고정됐고, 관측 명령이 팔을 그 자리에 세우므로 스스로 풀리지 않는 livelock이었다. 값은
  # `events.yaml`의 `moved_threshold_mm`(8)와 같은 척도다.
  self_occlusion_carry_mm: 8.0

instruction:
  enabled: true
  # **지시 변경 횟수** (s0.3, Task R1 B2-ii). 기본값은 사건이 잦은 프로파일 E2의 것이고 E0·E1은 아래에서 덮는다.
  # 횟수는 주 난수가 아니라 seed 해시로 고르므로 변경이 한 번인 프로파일(E1)의 장면·일정은 D1과 **같다**.
  changes: [3, 5]
  change_window_ms: [1200, 8000]      # 첫 변경이 일찍 오고 마지막 변경 뒤에도 옮길 시간이 남는다 — 창이
                                       # 에피소드가 끝난 뒤면 그 변경은 예정만 되고 사라진다(실측으로 좁혔다)
  min_gap_ms: 1000                     # 변경 사이 최소 간격 (1 s — 옮기다 말고 바꾸는 간격)
  # 두 번째 변경부터는 가끔 목표 **영역**도 바뀐다. 첫 변경은 영역을 두므로 D1과 같은 일정이다.
  zone_change_probability: 0.3
  # 도중 변경이 들여올 수 **없는** 영역. 개념 봉인(`robot:goal-zone:zoneF`)은 에피소드 계보(origin group =
  # v1의 목표 영역)의 성질이므로, 변경이 zoneF를 들여오면 같은 group의 에피소드가 두 split에 걸친다 —
  # 400편 실측에서 27 group이 그랬다(docs/04 §5의 "한 group은 한 split"을 어긴다).
  zone_change_excludes: [zoneF]
  # 목표 영역의 비중 (v1 지시의 목표 영역, docs/04 §5). zoneF("앞쪽 보관 영역")는 봉인 개념(`robot:goal-zone:zoneF`)이라 드물게
  # 둔다 — 그 계열 전부가 OOD로 가고 train은 zoneL/zoneR만 목표로 한다(장면에 zoneF가 **있는** 것과는 무관하다). 추첨은
  # 주 난수 스트림의 균등 추첨을 seed 해시의 기각 표본으로 다시 가중하므로 장면·일정의 난수 소비는 그대로고, zoneL/zoneR을
  # 뽑은 seed의 계획은 비중 도입 전과 같다. 대상이 목표 영역 안에 있어 영역을 바꿀 때도 같은 비중을 쓴다.
  goal_zone_weights: {zoneL: 48, zoneR: 48, zoneF: 4}
  # 문구 템플릿 변형 (docs/04 §5 템플릿 변형 계열, 계약 v0.4). 변형 id는 **명시**한다 — `Instruction.template`(`v1#<id>`)에
  # 적히고 docs/04 §5의 템플릿 holdout이 그것으로 봉인하므로, 문장이 바뀌면 id도 바꿔 옛 봉인(`v1#2`)이 조용히 새 문장에
  # 걸리지 않게 한다. R1의 id는 `a`·`b`·`c`이고 `c`가 봉인(`configs/data/r1_robot.yaml`)이다.
  #
  # **금지 물체 슬롯**(`{forbidden}`, s0.3 · Task R1 B1): 서식 v0.4에서 물체 소개 줄의 `attr=`와 구조화된 목표가 모델
  # 입력 밖이므로, 문장이 부르지 않은 제약은 모델이 알 길이 없다. 그래서 v1의 **모든** 변형이 취약 물체와 금지 물체를
  # 전부 나열한다(둘이면 `와/과`로 잇는다). 변경(v2 계열)은 제약을 다시 말하지 않는다 — 모델이 v1의 제약을 기억해야
  # 하는 것은 좋은 성질이다(docs/08 §3.1 "지시는 덧붙는다"). 규칙 기준군의 텍스트 근사 경로가 읽는 제약 표지
  # ("건드리지 마라")는 v1의 모든 변형에 있다.
  v1_templates:
    - {id: a, text: "{target_ul} {zone}으로 옮겨라. {forbidden}에는 손대지 말고 {fragile}도 건드리지 마라"}
    - {id: b, text: "{forbidden}에는 손대지 마라. {fragile}도 건드리지 마라. {target_ul} {zone}에 갖다 놓아라"}
    - {id: c, text: "{zone}에 {target_ul} 놓아라. {forbidden} 근처로 가지 말고 {fragile}도 건드리지 마라"}
  # 변경 지시. 버전이 v2든 v3든 이 계열에서 고르고 한 에피소드는 같은 변형을 쓴다.
  v2_templates:
    - {id: a, text: "{target} 대신 {target2_ul} {zone}으로 먼저 옮겨라"}
    - {id: b, text: "잠깐, {target} 말고 {target2_ul} {zone}에 먼저 놓아라"}
    - {id: c, text: "{target2_ul} {zone}으로 먼저 옮겨라. {target} 쪽은 그다음이다"}
  # 변형의 비중 (v1·변경 공통). 봉인 변형(`c`)을 고르게 뽑으면 에피소드의 1/3이 OOD로 가므로 드물게 둔다 — train은
  # `a`·`b`를 반반 보고 `c`는 OOD에만 있다. zoneF 계열·E1 계열 하나와 합쳐 OOD가 에피소드의 ≈10~15 %가 되는 값이며,
  # s0.3에서 **7**로 올렸다(D1은 5): 도중 변경이 zoneF를 들여올 수 없게 되어(`zone_change_excludes`) zoneF 봉인이
  # v1의 목표 영역에서만 오므로 OOD가 9 %로 내려갔다 — 400편 모의 실측으로 14.75 %(ood_dev 26 · ood_test 33)로 맞춘다.
  template_weights: [46.5, 46.5, 7]

disturbance:
  # 기본값은 사건이 잦은 프로파일 E2의 것이다(E0·E1은 아래에서 덮는다). 창은 에피소드가 **끝나기 전**이라야
  # 실제로 일어난다: D1의 `window_ms [1200, 20000]`은 평균 9.2 s로 끝나는 에피소드에서 절반이 적용되지 않았다
  # (s0.3, Task R1 B2-iii).
  count: [4, 7]
  window_ms: [1200, 8000]
  min_gap_ms: 600                       # 외란 사이 최소 간격
  # 외란의 몇 할이 **지시의 대상**을 미는가 (s0.3). 아무 물체나 밀면 대부분 결정과 무관한 사건이 된다 —
  # D1의 `object_moved` 467건은 물체 6~10개에 고르게 퍼져 대상은 1/7쯤이었다. 대상이 밀려야 commitment가
  # 표류로 풀리고 **다시 고르는 틱**이 생긴다. 어느 외란을 돌릴지는 seed 해시가 정한다(주 난수는 그대로).
  target_share: 0.7
  delta_x_mm: [-70, 70]
  delta_y_mm: [-70, 70]
  delta_yaw_deg: [-35, 35]

episode:
  # 지시가 최대 세 번 바뀌면(E2) 마지막 변경 뒤에도 옮길 시간이 있어야 한다. D1의 30 s는 마지막 변경이 늦은
  # 에피소드에서 모자랐다(`ep-E1-000235`·`ep-E1-000244`가 둘 다 `max_ms`로 끝났다). 완료한 에피소드는 done 꼬리에서
  # 끝나므로 상한을 올려도 길어지지 않는다 (s0.3).
  max_ms: 45000
  # 지시 변경·외란 시각을 내리는 격자. 제어 주기와 **무관한** 고정 격자여야 한다 —
  # 주기로 양자화하면 같은 seed라도 제어 주기를 바꾼 순간 일정이 달라져서
  # "외란은 모의 시간으로 정해진다"를 검사할 수 없다.
  schedule_grid_ms: 20

# 프로파일 (docs/05 §2 표, s0.3의 셋). E0는 참조 상태(정적 장면, 사건 없음), E1은 D1의 값(지시 변경 한 번,
# 외란 1~3회), E2는 **사건이 잦은** 것 = 이 파일의 기본값이다. 섞는 비중은 데이터 설정이 정한다
# (`configs/data/r1_robot.yaml`: E0/E1/E2 = 20/40/40 %).
profiles:
  E0:
    objects:
      count_min: 3
      count_max: 3
      fragile_count: [1, 1]
      forbidden_count: [1, 1]
    zones:
      count_min: 2
      count_max: 2
    instruction:
      enabled: false
    disturbance:
      count: [0, 0]
  # E1 = D1의 값. 같은 seed의 장면·지시·외란 일정이 D1과 **비트 단위로 같다**(변경 횟수·영역 변경은 주 난수를
  # 쓰지 않고, 변경이 한 번이면 난수 소비가 도입 전과 같다) — `ep-E1-000235`·`ep-E1-000244`를 재생할 수 있다.
  E1:
    instruction:
      changes: [1, 1]
      change_window_ms: [5000, 15000]
      min_gap_ms: 1500
    disturbance:
      count: [1, 3]
      window_ms: [1200, 20000]
      target_share: 0.0
  # E2 = 사건이 잦음. 기본값(지시 변경 3~5회·외란 4~7회)을 그대로 쓰고 물체만 조금 더 둔다 — 변경마다 **다른**
  # 평범한 물체를 불러야 하는데(같은 대상을 다시 부르지 않는다) 취약·금지가 1~2개씩 빠지면 6물체 장면에서 평범한
  # 물체가 2개뿐인 경우가 생겨 변경이 일찍 끊긴다. E2는 **의도한 스트레스 프로파일**이다: 사람이 1초 남짓마다 마음을
  # 바꾸는 빈도는 현장의 보통이 아니며, 현실적인 빈도는 E1(D1의 값)이 든다.
  E2:
    objects:
      count_min: 7
