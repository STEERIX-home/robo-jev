# E0/E1 장면 "어수선한 다물체 정리" — docs/02 §1, docs/05 §2.
#
# 장면·지시 변경·외란은 전부 reset seed에서 만든다. 외란은 **모의 시간**으로 정의하며
# 정책 호출 횟수와 무관하다(docs/05 §2). 모든 수치는 여기에만 둔다.
version: s0.2
default_profile: E1

simulator:
  backend: robosuite
  env_name: TidyClutter
  robot: Panda
  gripper: PandaGripper
  controller_config: configs/controller/osc_v0.yaml
  physics_dt_ms: 2
  control_hz: 50
  # headless. 렌더·카메라는 쓰지 않는다(YAGNI: E2에서 시뮬 3D 카메라를 붙인다).
  has_renderer: false
  has_offscreen_renderer: false

# docs/08 §3.2 직렬화 규약. serializer 버전(`version`)과 함께 고정한다.
serialization:
  position_unit: mm          # 위치는 mm 정수
  quaternion_decimals: 2     # 자세는 quaternion 소수 2자리
  time_unit: ms              # 시간은 ms 정수

table:
  full_size_m: [0.8, 0.8, 0.05]
  friction: [1.0, 0.005, 0.0001]
  offset_m: [0.0, 0.0, 0.8]

objects:
  count_min: 6
  count_max: 10
  shapes: [box, cylinder]
  shape_labels: {box: 상자, cylinder: 원통}   # 지시문에 들어가는 이름
  box_half_size_mm: [16, 28]          # 반변 길이 범위
  cylinder_radius_mm: [16, 26]
  cylinder_half_height_mm: [24, 40]
  density: 500.0
  friction: [0.95, 0.005, 0.0001]
  min_separation_mm: 85               # 중심 간 최소 거리
  # 금지 접촉 물체가 낀 쌍의 최소 간격은 따로다. 하네스는 금지 물체를 "외접 반지름 + planner.margin_mm +
  # planner.forbidden_margin_mm"의 장애물로 보므로(configs/harness/robot.yaml), 그 안에 이웃이 놓이면
  # 채택 → hold+forbidden_segment → forbidden_blocked가 되풀이된다. 85mm는 기본 한계(외접 반지름 + 25 ≈
  # 79mm, 가장 큰 원통)에 5mm 남짓만 남긴다. 수치는 복사하지 않고 하네스 설정에서 읽는다 — 위반한 금지
  # 물체만 다시 놓으므로 위반이 없는 seed의 장면은 그대로다.
  forbidden_separation:
    harness_config: configs/harness/robot.yaml
  spawn_x_mm: [-260, 60]              # 테이블 중심 기준
  spawn_y_mm: [-280, 280]
  spawn_attempts: 400
  fragile_count: [1, 2]
  forbidden_count: [1, 2]
  palette:                            # 색은 물체를 구분하는 설명이다. 이름이 상태에 들어간다
    - {name: red, ko: 빨간, rgba: [0.80, 0.16, 0.16, 1.0]}
    - {name: blue, ko: 파란, rgba: [0.16, 0.34, 0.80, 1.0]}
    - {name: green, ko: 초록, rgba: [0.18, 0.62, 0.30, 1.0]}
    - {name: yellow, ko: 노란, rgba: [0.90, 0.78, 0.18, 1.0]}
    - {name: purple, ko: 보라, rgba: [0.55, 0.26, 0.72, 1.0]}
    - {name: orange, ko: 주황, rgba: [0.92, 0.52, 0.14, 1.0]}
    - {name: cyan, ko: 청록, rgba: [0.18, 0.70, 0.74, 1.0]}
    - {name: pink, ko: 분홍, rgba: [0.90, 0.48, 0.66, 1.0]}
    - {name: brown, ko: 갈색, rgba: [0.45, 0.31, 0.20, 1.0]}
    - {name: grey, ko: 회색, rgba: [0.55, 0.55, 0.57, 1.0]}

zones:
  count_min: 2
  count_max: 3
  candidates:                          # bounds_mm = [x0, y0, x1, y1] (테이블 중심 기준)
    - {id: zoneL, desc: "왼쪽 정리 영역", bounds_mm: [-120, 150, 180, 330]}
    - {id: zoneR, desc: "오른쪽 정리 영역", bounds_mm: [-120, -330, 180, -150]}
    - {id: zoneF, desc: "앞쪽 보관 영역", bounds_mm: [100, -80, 300, 80]}

visibility:
  # 고정 시점에서 물체 윗면 표본을 훑는 가림 근사. 앞단(3D 재구성)이 채울 수 있는 값만 만든다.
  # 시점은 테이블 건너편 위(앞쪽·위)다. 이전 값 [-150, 0, 700]은 홈 자세의 팔 바로 위라 팔 아래
  # 물체가 그늘에 들어갔다(reset에서 보이는 물체 비율 E0 0.57·E1 0.64, 대상 0.60·0.65 — 리뷰 10의
  # E0 폐루프 실패 원인). 이 값은 seed 1..20의 reset에서 E0·E1 모두 물체 100%가 문턱 이상이다.
  viewpoint_mm: [600, 0, 700]          # 테이블 윗면 중심 기준 상대 위치
  samples: 5                            # 중심 + 윗면 네 모서리
  visible_ratio_threshold: 0.6
  inflate_mm: 4.0

instruction:
  enabled: true
  change_window_ms: [5000, 15000]      # docs/02 §1 "에피소드 도중(5~15초 사이)에 지시가 바뀌고"
  # 목표 영역의 비중 (v1 지시의 목표 영역, docs/04 §5). zoneF("앞쪽 보관 영역")는 봉인 개념(`robot:goal-zone:zoneF`)이라 드물게
  # 둔다 — 그 계열 전부가 OOD로 가고 train은 zoneL/zoneR만 목표로 한다(장면에 zoneF가 **있는** 것과는 무관하다). 추첨은
  # 주 난수 스트림의 균등 추첨을 seed 해시의 기각 표본으로 다시 가중하므로 장면·일정의 난수 소비는 그대로고, zoneL/zoneR을
  # 뽑은 seed의 계획은 비중 도입 전과 같다. 대상이 목표 영역 안에 있어 영역을 바꿀 때도 같은 비중을 쓴다.
  goal_zone_weights: {zoneL: 48, zoneR: 48, zoneF: 4}
  # 문구 템플릿 변형 (docs/04 §5 템플릿 변형 계열, 계약 v0.3). 슬롯 `{color} {shape} {zone} {fragile}`(v2는 `{color2}
  # {shape2}`)은 같고 표현만 다르다 — 구조화된 목표(대상·영역·보호 물체)는 텍스트와 무관하게 계획이 든다. 변형은 난수가 아니라
  # **origin group(`robot/<프로파일>/<계열>/goal-<영역>`)의 해시**로 고르므로 같은 group의 에피소드는 같은 변형이다(템플릿
  # holdout이 한 group을 두 split에 걸치게 하지 않는다) — `Instruction.template`(`v1#<번호>`)에 적힌다; 3번(번호 2)은
  # `configs/data/d1_robot.yaml`이 봉인 holdout으로 건다. 규칙 기준군의 텍스트 근사 경로가 읽는 제약 표지("건드리지 마라")는
  # v1의 모든 변형에 있다.
  v1_templates:
    - "{color} {shape}를 {zone}으로 옮기고 {fragile}는 건드리지 마라"
    - "{fragile}는 건드리지 마라. {color} {shape}를 {zone}에 갖다 놓아라"
    - "{zone}에 {color} {shape}를 놓아라, {fragile}는 건드리지 마라"
  v2_templates:
    - "{color} {shape} 대신 {color2} {shape2}를 {zone}으로 먼저 옮겨라"
    - "잠깐, {color} {shape}는 두고 {color2} {shape2}를 {zone}에 먼저 놓아라"
    - "{color2} {shape2}를 {zone}으로 먼저 옮겨라. {color} {shape}는 그다음이다"
  # 변형의 비중 (v1·v2 공통). 봉인 변형(3번)을 고르게 뽑으면 에피소드의 1/3이 OOD로 가므로 드물게 둔다 — train은 1·2번을
  # 반반 보고, 3번은 OOD에만 있다. zoneF 계열·E1 계열 하나와 합쳐 OOD가 에피소드의 ≈10~15 %가 되는 값(400편 모의 실측은
  # docs/04 §5 표).
  template_weights: [47.5, 47.5, 5]

disturbance:
  count: [1, 3]
  window_ms: [1200, 20000]
  min_gap_ms: 600                       # 외란 사이 최소 간격
  delta_x_mm: [-70, 70]
  delta_y_mm: [-70, 70]
  delta_yaw_deg: [-35, 35]

episode:
  max_ms: 30000
  # 지시 변경·외란 시각을 내리는 격자. 제어 주기와 **무관한** 고정 격자여야 한다 —
  # 주기로 양자화하면 같은 seed라도 제어 주기를 바꾼 순간 일정이 달라져서
  # "외란은 모의 시간으로 정해진다"를 검사할 수 없다.
  schedule_grid_ms: 20

# E0는 참조 상태다: 정적 장면, 지시 변경·외란 없음 (docs/05 §2 표).
profiles:
  E0:
    objects:
      count_min: 3
      count_max: 3
      fragile_count: [1, 1]
      forbidden_count: [1, 1]
    zones:
      count_min: 2
      count_max: 2
    instruction:
      enabled: false
    disturbance:
      count: [0, 0]
  E1: {}
